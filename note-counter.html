<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Black MIDI Precise Frame Renderer</title>
    <script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="controls">
        <div class="row">
            <div class="file-input-wrapper">
                <button class="btn-file">Import MIDI</button>
                <input type="file" id="midi-file" accept=".mid,.midi">
            </div>
            <div class="file-input-wrapper">
                <button class="btn-file btn-font">Import Font</button>
                <input type="file" id="font-file" accept=".ttf,.otf">
            </div>
            <button id="btn-record" disabled>Render Video</button>
        </div>
        <div id="status-msg">Select a MIDI file to begin...</div>

        <div class="row customizer-row">
            <div class="control-group">
                <label>Display Mode:</label>
                <select id="cfg-display-mode">
                    <option value="counter">Counter HUD</option>
                    <option value="graph" selected>Graph HUD (MidiGraphRenderer)</option>
                </select>
            </div>

            <div class="control-group counter-only-control">
                <label>HUD Style:</label>
                <select id="cfg-hud-style">
                    <option value="cjc">CJC Style (Impact)</option>
                    <option value="orangepaprika">OrangePaprika Style (Pixel)</option>
                    <option value="h63dnc" selected>H63DNC Style (Dual HUD)</option>
                </select>
            </div>

            <div class="control-group check-group">
                <input type="checkbox" id="cfg-bold" checked>
                <label for="cfg-bold">Bold</label>
            </div>

            <div class="control-group check-group">
                <input type="checkbox" id="cfg-use-stroke" checked>
                <label for="cfg-use-stroke">Outline</label>
            </div>

            <div class="control-group check-group counter-only-control">
                <input type="checkbox" id="cfg-show-max-nps" checked>
                <label for="cfg-show-max-nps">Show Max NPS</label>
            </div>

            <div class="control-group check-group counter-only-control">
                <input type="checkbox" id="cfg-show-max-poly" checked>
                <label for="cfg-show-max-poly">Show Max Polyphony</label>
            </div>

            <div class="control-group counter-only-control">
                <label>Color:</label>
                <input type="color" id="cfg-text" value="#ffffff">
            </div>

            <div class="control-group counter-only-control">
                <label>Stroke:</label>
                <input type="number" id="cfg-stroke" value="6" min="1" max="30">
            </div>

            <div class="control-group counter-only-control">
                <label>Size:</label>
                <input type="number" id="cfg-size" value="28" min="12" max="120">
            </div>

            <div class="control-group counter-only-control">
                <label>Spacing:</label>
                <input type="number" id="cfg-spacing" value="36" min="15" max="150">
            </div>

            <div class="control-group">
                <label>Multiplier:</label>
                <input type="text" id="cfg-multiplier" value="1" placeholder="1 or inf">
            </div>

            <div class="control-group counter-only-control">
                <label>BPM Decimals:</label>
                <input type="number" id="cfg-decimals" value="0" min="0" max="10" step="1">
            </div>

            <div class="control-group check-group">
                <input type="checkbox" id="cfg-swap-sep">
                <label for="cfg-swap-sep">Swap , and . (1.234,5)</label>
            </div>

            <div class="control-group">
                <label>Render Res:</label>
                <select id="cfg-res">
                    <option value="1080p">1080p (FHD)</option>
                    <option value="1440p" selected>1440p (2K Ultra-Sharp)</option>
                    <option value="2160p">2160p (4K Extreme)</option>
                </select>
            </div>
        </div>

        <div class="row customizer-row counter-only-control" id="metrics-panel">
            <span class="panel-title">Active Display Metrics (Drag / Order & Select):</span>
            <div id="metrics-list"></div>
        </div>

        <div class="row customizer-row graph-only-control" id="graph-metrics-panel">
            <span class="panel-title">Active Graph Displays:</span>
            <div id="graph-metrics-list"></div>
        </div>
    </div>

    <canvas id="counter-canvas"></canvas>

<style>

    #controls {

        background: rgba(15, 15, 15, 0.95);
        padding: 15px 25px;

    .row {

    }

<script>
const canvas = document.getElementById('counter-canvas');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: false });
const statusMsg = document.getElementById('status-msg');
const recordBtn = document.getElementById('btn-record');

let customFontFamily = null;

let hudMetrics = [
    { id: 'notes', label: 'Notes: ', enabled: true, key: 'notes' },
    { id: 'nps', label: 'NPS: ', enabled: true, key: 'nps' },
    { id: 'polyphony', label: 'Polyphony: ', enabled: true, key: 'polyphony' },
    { id: 'ticks', label: 'Ticks: ', enabled: false, key: 'ticks' },
    { id: 'ppq', label: 'PPQ: ', enabled: false, key: 'ppq' },
    { id: 'bpm', label: 'BPM: ', enabled: false, key: 'bpm' },
    { id: 'time', label: 'Time: ', enabled: false, key: 'time' }
];

let graphMetrics = [
    { id: 'nps', label: 'NPS', enabled: true, color: '#32f6ff' },
    { id: 'polyphony', label: 'Polyphony', enabled: true, color: '#ff4343' }
];

const config = {
    displayMode: document.getElementById('cfg-display-mode').value,
    hudStyle: document.getElementById('cfg-hud-style').value,
    isBold: document.getElementById('cfg-bold').checked,
    useStroke: document.getElementById('cfg-use-stroke').checked,
    showMaxNps: document.getElementById('cfg-show-max-nps').checked,
    showMaxPoly: document.getElementById('cfg-show-max-poly').checked,
    decimals: 0,
    swapSeparators: document.getElementById('cfg-swap-sep').checked,
    textColor: document.getElementById('cfg-text').value,
    strokeWidth: parseInt(document.getElementById('cfg-stroke').value),
    bgStyle: '#000000',
    fontSize: parseInt(document.getElementById('cfg-size').value),
    lineSpacing: parseInt(document.getElementById('cfg-spacing').value),
    resPreset: document.getElementById('cfg-res').value,
    multiplier: 1,
    isInfinite: false,
    xOffset: 30,
    yOffset: 35
};

let npsHistory = [];
let polyphonyHistory = [];
const maxGraphPoints = 180;

const graphBounds = {
    NPS: { min: 0, max: 2 },
    Polyphony: { min: 0, max: 2 }
};

function getNiceMax(rawMax) {
    if (rawMax <= 2) return 2;
    if (rawMax <= 4) return 4;
    if (rawMax <= 8) return 8;
    if (rawMax <= 10) return 10;
    const exponent = Math.floor(Math.log10(rawMax));
    const fraction = rawMax / Math.pow(10, exponent);
    let niceFraction;

    if (fraction <= 1.0) niceFraction = 1.0;
    else if (fraction <= 2.0) niceFraction = 2.0;
    else if (fraction <= 2.5) niceFraction = 2.5;
    else if (fraction <= 5.0) niceFraction = 5.0;
    else niceFraction = 10.0;

    return niceFraction * Math.pow(10, exponent);
}

function updateControlVisibility() {
    const isGraph = config.displayMode === 'graph';
    document.querySelectorAll('.counter-only-control').forEach(el => {
        el.style.display = isGraph ? 'none' : '';
    });
    document.querySelectorAll('.graph-only-control').forEach(el => {
        el.style.display = isGraph ? '' : 'none';
    });
}

function renderMetricsUI() {
    const container = document.getElementById('metrics-list');
    container.innerHTML = '';

    hudMetrics.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'metric-card';

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = item.enabled;
        check.addEventListener('change', e => {
            item.enabled = e.target.checked;
            updatePreview();
        });

        const labelInput = document.createElement('input');
        labelInput.type = 'text';
        labelInput.value = item.label;
        labelInput.title = 'Custom Label';
        labelInput.addEventListener('input', e => {
            item.label = e.target.value;
            updatePreview();
        });

        const orderSelect = document.createElement('select');
        for (let i = 0; i < hudMetrics.length; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `#${i + 1}`;
            if (i === index) opt.selected = true;
            orderSelect.appendChild(opt);
        }
        orderSelect.addEventListener('change', e => {
            const newIndex = parseInt(e.target.value);
            const [movedItem] = hudMetrics.splice(index, 1);
            hudMetrics.splice(newIndex, 0, movedItem);
            renderMetricsUI();
            updatePreview();
        });

        card.appendChild(check);
        card.appendChild(labelInput);
        card.appendChild(orderSelect);
        container.appendChild(card);
    });
}

function renderGraphMetricsUI() {
    const container = document.getElementById('graph-metrics-list');
    container.innerHTML = '';

    graphMetrics.forEach(item => {
        const card = document.createElement('div');
        card.className = 'metric-card';

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = item.enabled;
        check.addEventListener('change', e => {
            item.enabled = e.target.checked;
            updatePreview();
        });

        const labelInput = document.createElement('input');
        labelInput.type = 'text';
        labelInput.value = item.label;
        labelInput.title = 'Custom Label';
        labelInput.addEventListener('input', e => {
            item.label = e.target.value;
            updatePreview();
        });

        card.appendChild(check);
        card.appendChild(labelInput);
        container.appendChild(card);
    });
}

function updateDynamicBackground() {
    let hex = config.textColor.replace('#', '');
    if (hex.length === 3) {
        hex = hex.split('').map(c => c + c).join('');
    }
    const r = parseInt(hex.substring(0, 2), 16) || 0;
    const g = parseInt(hex.substring(2, 4), 16) || 0;
    const b = parseInt(hex.substring(4, 6), 16) || 0;

    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

    if (luminance < 0.4) {
        config.bgStyle = '#ffffff';
    } else {
        config.bgStyle = '#000000';
    }
}

const parseMultiplierInput = (rawVal) => {
    const valStr = rawVal.trim().toLowerCase();
    if (valStr === 'inf' || valStr === 'infinity' || valStr === '∞') {
        config.isInfinite = true;
        config.multiplier = Infinity;
    } else {
        const parsed = parseFloat(valStr);
        if (!isNaN(parsed) && parsed === Infinity) {
            config.isInfinite = true;
            config.multiplier = Infinity;
        } else {
            config.isInfinite = false;
            config.multiplier = isNaN(parsed) ? 1 : parsed;
        }
    }
};

document.getElementById('font-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;

    const fontName = 'CustomFont_' + Date.now();
    try {
        const buffer = await file.arrayBuffer();
        const customFont = new FontFace(fontName, buffer);
        await customFont.load();
        document.fonts.add(customFont);

        customFontFamily = fontName;
        statusMsg.textContent = `Font "${file.name}" loaded successfully!`;
        updatePreview();
    } catch (err) {
        alert("Failed to load font file: " + err.message);
    }
});

document.getElementById('cfg-display-mode').addEventListener('change', e => {
    config.displayMode = e.target.value;
    updateControlVisibility();
    updatePreview();
});

document.getElementById('cfg-hud-style').addEventListener('change', e => {
    config.hudStyle = e.target.value;
    if (config.hudStyle === 'cjc') {
        config.isBold = false;
        document.getElementById('cfg-bold').checked = false;
    }
    updatePreview();
});

document.getElementById('cfg-bold').addEventListener('change', e => {
    config.isBold = e.target.checked;
    updatePreview();
});

document.getElementById('cfg-use-stroke').addEventListener('change', e => {
    config.useStroke = e.target.checked;
    updatePreview();
});

document.getElementById('cfg-show-max-nps').addEventListener('change', e => {
    config.showMaxNps = e.target.checked;
    updatePreview();
});

document.getElementById('cfg-show-max-poly').addEventListener('change', e => {
    config.showMaxPoly = e.target.checked;
    updatePreview();
});

document.getElementById('cfg-swap-sep').addEventListener('change', e => {
    config.swapSeparators = e.target.checked;
    updatePreview();
});

document.getElementById('cfg-decimals').addEventListener('input', e => {
    const v = parseInt(e.target.value);
    config.decimals = isNaN(v) ? 0 : Math.min(10, Math.max(0, v));
    updatePreview();
});

document.getElementById('cfg-text').addEventListener('input', e => {
    config.textColor = e.target.value;
    updateDynamicBackground();
    updatePreview();
});

document.getElementById('cfg-stroke').addEventListener('input', e => {
    config.strokeWidth = parseInt(e.target.value) || 0;
    updatePreview();
});

document.getElementById('cfg-size').addEventListener('input', e => {
    config.fontSize = parseInt(e.target.value) || 28;
    updatePreview();
});

document.getElementById('cfg-spacing').addEventListener('input', e => {
    config.lineSpacing = parseInt(e.target.value) || 38;
    updatePreview();
});

document.getElementById('cfg-multiplier').addEventListener('input', e => {
    parseMultiplierInput(e.target.value);
    updatePreview();
});

document.getElementById('cfg-res').addEventListener('change', e => {
    config.resPreset = e.target.value;
    resize();
});

parseMultiplierInput(document.getElementById('cfg-multiplier').value);
updateDynamicBackground();
updateControlVisibility();
renderMetricsUI();
renderGraphMetricsUI();

let notes = [];
let songLengthSec = 0;
let isRendering = false;
let currentTicksTrack = 0;
let ticksPerBeatTrack = 480;

let metrics = {
    totalNotes: 0,
    polyphony: 0,
    maxPolyphony: 0,
    nps: 0,
    maxNps: 0,
    bpm: 120
};

let activeRenderNotes = [];
let nextNoteIndex = 0;
let currentVideoTime = 0;
const fpsTimeStep = 1 / 60;

let mediaRecorder;
let recordedChunks = [];
let videoTrack = null;

function resize() {
    let width = 1920;
    let height = 1080;

    if (config.resPreset === '1440p') {
        width = 2560;
        height = 1440;
    } else if (config.resPreset === '2160p') {
        width = 3840;
        height = 2160;
    }

    canvas.width = width;
    canvas.height = height;

    updatePreview();
}

window.addEventListener('resize', resize);

function binarySearchNoteIndex(array, targetTime) {
    let low = 0;
    let high = array.length - 1;

    while (low <= high) {
        let mid = (low + high) >> 1;

        if (array[mid].time < targetTime) {
            low = mid + 1;
        } else {
            high = mid - 1;
        }
    }

    return low;
}

function formatFormattedTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = (seconds % 60).toFixed(4);
    const formattedMins = mins < 10 ? '0' + mins : mins;
    const formattedSecs = (seconds % 60) < 10 ? '0' + secs : secs;
    return `${formattedMins}:${formattedSecs}`;
}

// Swaps "," and "." in an already formatted string (1,234.5 -> 1.234,5)
function swapSep(str) {
    if (!config.swapSeparators) return str;
    return str.replace(/[,.]/g, c => (c === ',' ? '.' : ','));
}

// Counts are always whole numbers (with the separator switch applied)
function formatNum(value) {
    return swapSep(Math.floor(value).toLocaleString('en-US'));
}

// BPM is the only value that uses the Decimals setting (0 = no decimals)
function formatBpm(bpm) {
    return swapSep(bpm.toFixed(config.decimals));
}

function updatePreview() {
    if (isRendering) return;
    drawHUDFrame();
}

function drawHUDFrame() {
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    ctx.fillStyle = config.bgStyle;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const scaleFactor = canvas.height / 1080;

    let multipliedNotesStr = "0";
    let multipliedNpsStr = "0";
    let multipliedMaxNpsStr = "0";

    if (config.isInfinite) {
        multipliedNotesStr = metrics.totalNotes > 0 ? "Infinity" : "0";
        multipliedNpsStr = metrics.nps > 0 ? "Infinity" : "0";
        multipliedMaxNpsStr = metrics.maxNps > 0 ? "Infinity" : "0";
    } else {
        multipliedNotesStr = formatNum(metrics.totalNotes * config.multiplier);
        multipliedNpsStr = formatNum(metrics.nps * config.multiplier);
        multipliedMaxNpsStr = formatNum(metrics.maxNps * config.multiplier);
    }

    if (config.displayMode === 'graph') {
        drawGraphRendererHUD(scaleFactor);
        return;
    }

    if (config.hudStyle === 'h63dnc') {
        drawH63DNCHUD(scaleFactor, multipliedNotesStr, multipliedNpsStr, multipliedMaxNpsStr);
        return;
    }

    const scaledFontSize = Math.round(config.fontSize * scaleFactor);
    const scaledStrokeWidth = Math.round(config.strokeWidth * scaleFactor);
    const scaledLineSpacing = Math.round(config.lineSpacing * scaleFactor);
    const scaledXOffset = Math.round(config.xOffset * scaleFactor);
    const scaledYOffset = Math.round(config.yOffset * scaleFactor);

    let baseFontName = customFontFamily
        ? `'${customFontFamily}', sans-serif`
        : config.hudStyle === 'orangepaprika'
        ? "'Press Start 2P', monospace"
        : (config.isBold ? "Impact, sans-serif" : "Arial, sans-serif");

    let boldPrefix = config.isBold ? "bold " : "";

    ctx.font = `${boldPrefix}${scaledFontSize}px ${baseFontName}`;
    ctx.textBaseline = 'top';

    ctx.strokeStyle = '#000000';
    ctx.lineWidth = scaledStrokeWidth * 2;
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;

    ctx.fillStyle = config.textColor;

    let displayLines = [];

    hudMetrics.forEach(item => {
        if (!item.enabled) return;

        let valStr = "";
        switch (item.key) {
            case 'notes':
                valStr = multipliedNotesStr;
                break;
            case 'nps':
                valStr = multipliedNpsStr;
                if (config.showMaxNps) {
                    valStr += ` (Max: ${multipliedMaxNpsStr})`;
                }
                break;
            case 'polyphony':
                valStr = formatNum(metrics.polyphony);
                if (config.showMaxPoly) {
                    valStr += ` (Max: ${formatNum(metrics.maxPolyphony)})`;
                }
                break;
            case 'ticks':
                valStr = swapSep(currentTicksTrack.toLocaleString('en-US'));
                break;
            case 'ppq':
                valStr = swapSep(ticksPerBeatTrack.toLocaleString('en-US'));
                break;
            case 'bpm':
                valStr = formatBpm(metrics.bpm);
                break;
            case 'time':
                valStr = swapSep(formatFormattedTime(currentVideoTime));
                break;
        }

        displayLines.push(`${item.label}${valStr}`);
    });

    let currentY = scaledYOffset;

    displayLines.forEach(textLine => {
        if (config.useStroke && scaledStrokeWidth > 0) {
            ctx.strokeText(textLine, scaledXOffset, currentY);
        }
        ctx.fillText(textLine, scaledXOffset, currentY);

        currentY += scaledLineSpacing;
    });
}

function drawGraphBox(title, x, y, width, height, history, lineColor, scaleFactor) {
    ctx.save();
    
    ctx.fillStyle = 'rgba(10, 10, 15, 0.85)';
    ctx.strokeStyle = 'rgba(100, 100, 120, 0.8)';
    ctx.lineWidth = 2 * scaleFactor;
    ctx.fillRect(x, y, width, height);
    ctx.strokeRect(x, y, width, height);

    const fontStack = customFontFamily ? `'${customFontFamily}', sans-serif` : "'Segoe UI', Arial, sans-serif";

    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.round(18 * scaleFactor)}px ${fontStack}`;
    ctx.textAlign = 'left';
    ctx.fillText(title, x + 10 * scaleFactor, y + 10 * scaleFactor);

    let rawMax = history.length > 0 ? Math.max(...history) : 2;
    let rawMin = history.length > 0 ? Math.min(...history) : 0;

    let targetMax = getNiceMax(rawMax);
    let targetMin = Math.max(0, Math.floor(rawMin));
    if (targetMin >= targetMax) targetMin = Math.max(0, targetMax - 2);

    if (!graphBounds[title]) {
        graphBounds[title] = { min: targetMin, max: targetMax };
    } else {
        // Smooth lerp movement for both min and max bounds to glide like danidanijr's renderer
        graphBounds[title].min += (targetMin - graphBounds[title].min) * 0.15;
        graphBounds[title].max += (targetMax - graphBounds[title].max) * 0.15;
    }

    const maxVal = graphBounds[title].max;
    const minVal = graphBounds[title].min;

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.font = `${Math.round(10 * scaleFactor)}px ${fontStack}`;
    ctx.textAlign = 'left';

    const gridLines = 4;
    const paddingX = 65 * scaleFactor;
    const paddingY = 35 * scaleFactor;
    const graphW = width - paddingX - 15 * scaleFactor;
    const graphH = height - paddingY - 15 * scaleFactor;
    const graphX = x + paddingX;
    const graphY = y + paddingY;

    for (let i = 0; i <= gridLines; i++) {
        const lineY = graphY + (graphH * (i / gridLines));
        // Rounded values smoothly moving along the axis
        const val = Math.round(maxVal - ((i / gridLines) * (maxVal - minVal)));

        ctx.beginPath();
        ctx.moveTo(graphX, lineY);
        ctx.lineTo(graphX + graphW, lineY);
        ctx.stroke();

        ctx.fillText(swapSep(val.toLocaleString('en-US')), x + 10 * scaleFactor, lineY - 4 * scaleFactor);
    }

    if (history.length > 1) {
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 3 * scaleFactor;
        ctx.beginPath();

        const range = Math.max(1, maxVal - minVal);

        for (let i = 0; i < history.length; i++) {
            const px = graphX + (graphW * (i / (maxGraphPoints - 1)));
            const normalizedVal = (history[i] - minVal) / range;
            const py = graphY + graphH - (graphH * normalizedVal);

            if (i === 0) {
                ctx.moveTo(px, py);
            } else {
                ctx.lineTo(px, py);
            }
        }
        ctx.stroke();
    }

    ctx.restore();
}

function drawGraphRendererHUD(scaleFactor) {
    const boxW = 500 * scaleFactor;
    const boxH = 220 * scaleFactor;

    const npsGraph = graphMetrics.find(m => m.id === 'nps');
    if (npsGraph && npsGraph.enabled) {
        drawGraphBox(npsGraph.label, 30 * scaleFactor, 30 * scaleFactor, boxW, boxH, npsHistory, npsGraph.color, scaleFactor);
    }

    const polyGraph = graphMetrics.find(m => m.id === 'polyphony');
    if (polyGraph && polyGraph.enabled) {
        drawGraphBox(polyGraph.label, canvas.width - boxW - (30 * scaleFactor), 30 * scaleFactor, boxW, boxH, polyphonyHistory, polyGraph.color, scaleFactor);
    }
}

function drawH63DNCHUD(scaleFactor, multipliedNotesStr, multipliedNpsStr, multipliedMaxNpsStr) {
    const mainFontSize = Math.round(36 * scaleFactor);
    const subFontSize = Math.round(18 * scaleFactor);
    const fontStack = customFontFamily ? `'${customFontFamily}', sans-serif` : "'Rajdhani', 'Segoe UI', sans-serif";
    
    ctx.textBaseline = 'top';
    
    function drawIcon(type, x, y, color) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.lineWidth = 2 * scaleFactor;

        if (type === 'polyphony') {
            ctx.font = `bold ${subFontSize}px ${fontStack}`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.beginPath();
            ctx.arc(x + 12 * scaleFactor, y + 12 * scaleFactor, 12 * scaleFactor, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillText('P', x + 12 * scaleFactor, y + 13 * scaleFactor);
        } else if (type === 'bpm') {
            ctx.beginPath();
            ctx.arc(x + 12 * scaleFactor, y + 14 * scaleFactor, 11 * scaleFactor, Math.PI * 0.8, Math.PI * 2.2);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + 12 * scaleFactor, y + 14 * scaleFactor);
            ctx.lineTo(x + 19 * scaleFactor, y + 7 * scaleFactor);
            ctx.stroke();
        } else if (type === 'ppq') {
            ctx.beginPath();
            ctx.rect(x + 2 * scaleFactor, y + 4 * scaleFactor, 20 * scaleFactor, 16 * scaleFactor);
            ctx.stroke();
            ctx.moveTo(x + 12 * scaleFactor, y + 4 * scaleFactor);
            ctx.lineTo(x + 12 * scaleFactor, y + 20 * scaleFactor);
            ctx.stroke();
        } else if (type === 'nps') {
            ctx.beginPath();
            ctx.rect(x + 2 * scaleFactor, y + 2 * scaleFactor, 20 * scaleFactor, 20 * scaleFactor);
            ctx.stroke();
            ctx.fillRect(x + 6 * scaleFactor, y + 6 * scaleFactor, 4 * scaleFactor, 4 * scaleFactor);
            ctx.fillRect(x + 14 * scaleFactor, y + 6 * scaleFactor, 4 * scaleFactor, 4 * scaleFactor);
            ctx.fillRect(x + 6 * scaleFactor, y + 14 * scaleFactor, 4 * scaleFactor, 4 * scaleFactor);
            ctx.fillRect(x + 14 * scaleFactor, y + 14 * scaleFactor, 4 * scaleFactor, 4 * scaleFactor);
        } else if (type === 'notes') {
            ctx.beginPath();
            ctx.arc(x + 8 * scaleFactor, y + 18 * scaleFactor, 4 * scaleFactor, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(x + 10 * scaleFactor, y + 4 * scaleFactor, 3 * scaleFactor, 14 * scaleFactor);
            ctx.fillRect(x + 10 * scaleFactor, y + 4 * scaleFactor, 10 * scaleFactor, 4 * scaleFactor);
        } else if (type === 'time') {
            ctx.beginPath();
            ctx.arc(x + 12 * scaleFactor, y + 14 * scaleFactor, 10 * scaleFactor, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillRect(x + 10 * scaleFactor, y + 1 * scaleFactor, 4 * scaleFactor, 3 * scaleFactor);
            ctx.beginPath();
            ctx.moveTo(x + 12 * scaleFactor, y + 14 * scaleFactor);
            ctx.lineTo(x + 12 * scaleFactor, y + 8 * scaleFactor);
            ctx.stroke();
        }
        ctx.restore();
    }

    function renderGlowingText(text, x, y, font, color, glowColor, align = 'left') {
        ctx.save();
        ctx.font = font;
        ctx.textAlign = align;
        ctx.textBaseline = 'top';

        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 12 * scaleFactor;
        ctx.fillStyle = color;

        if (config.useStroke) {
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4 * scaleFactor;
            ctx.strokeText(text, x, y);
        }

        ctx.fillText(text, x, y);
        ctx.fillText(text, x, y);
        ctx.restore();
    }

    const leftX = 40 * scaleFactor;
    const leftY = 40 * scaleFactor;
    const cyanColor = '#32f6ff';

    drawIcon('polyphony', leftX, leftY + 6 * scaleFactor, cyanColor);
    renderGlowingText(
        formatNum(metrics.polyphony),
        leftX + 35 * scaleFactor,
        leftY,
        `bold ${mainFontSize}px ${fontStack}`,
        cyanColor,
        'rgba(0, 240, 255, 0.8)'
    );
    if (config.showMaxPoly) {
        renderGlowingText(
            `Max ${formatNum(metrics.maxPolyphony)}`,
            leftX + 35 * scaleFactor,
            leftY + 38 * scaleFactor,
            `bold ${subFontSize}px ${fontStack}`,
            'rgba(255, 255, 255, 0.7)',
            'rgba(0, 240, 255, 0.4)'
        );
    }

    const bpmY = leftY + 70 * scaleFactor;
    drawIcon('bpm', leftX, bpmY + 6 * scaleFactor, cyanColor);
    renderGlowingText(
        formatBpm(metrics.bpm),
        leftX + 35 * scaleFactor,
        bpmY,
        `bold ${mainFontSize}px ${fontStack}`,
        cyanColor,
        'rgba(0, 240, 255, 0.8)'
    );

    const ppqY = leftY + 120 * scaleFactor;
    drawIcon('ppq', leftX, ppqY + 6 * scaleFactor, cyanColor);
    renderGlowingText(
        swapSep(ticksPerBeatTrack.toString()),
        leftX + 35 * scaleFactor,
        ppqY,
        `bold ${mainFontSize}px ${fontStack}`,
        cyanColor,
        'rgba(0, 240, 255, 0.8)'
    );

    const rightX = canvas.width - (40 * scaleFactor);
    const rightY = 40 * scaleFactor;
    const redColor = '#ff4343';

    drawIcon('nps', rightX - 25 * scaleFactor, rightY + 6 * scaleFactor, redColor);
    renderGlowingText(
        multipliedNpsStr,
        rightX - 35 * scaleFactor,
        rightY,
        `bold ${mainFontSize}px ${fontStack}`,
        redColor,
        'rgba(255, 50, 50, 0.8)',
        'right'
    );
    if (config.showMaxNps) {
        renderGlowingText(
            `${multipliedMaxNpsStr} Max`,
            rightX - 35 * scaleFactor,
            rightY + 38 * scaleFactor,
            `bold ${subFontSize}px ${fontStack}`,
            'rgba(255, 255, 255, 0.7)',
            'rgba(255, 50, 50, 0.4)',
            'right'
        );
    }

    const notesY = rightY + 70 * scaleFactor;
    drawIcon('notes', rightX - 25 * scaleFactor, notesY + 6 * scaleFactor, redColor);
    renderGlowingText(
        multipliedNotesStr,
        rightX - 35 * scaleFactor,
        notesY,
        `bold ${mainFontSize}px ${fontStack}`,
        redColor,
        'rgba(255, 50, 50, 0.8)',
        'right'
    );

    const timeY = rightY + 120 * scaleFactor;
    drawIcon('time', rightX - 25 * scaleFactor, timeY + 6 * scaleFactor, redColor);
    renderGlowingText(
        swapSep(formatFormattedTime(currentVideoTime)),
        rightX - 35 * scaleFactor,
        timeY,
        `bold ${mainFontSize}px ${fontStack}`,
        redColor,
        'rgba(255, 50, 50, 0.8)',
        'right'
    );
}

function updateStateForTime() {
    const noteIndex = binarySearchNoteIndex(notes, currentVideoTime);
    metrics.totalNotes = noteIndex;

    activeRenderNotes = activeRenderNotes.filter(note => note.endTime > currentVideoTime);

    while (
        nextNoteIndex < notes.length &&
        notes[nextNoteIndex].time <= currentVideoTime
    ) {
        if (notes[nextNoteIndex].endTime > currentVideoTime) {
            activeRenderNotes.push(notes[nextNoteIndex]);
        }
        nextNoteIndex++;
    }

    metrics.polyphony = activeRenderNotes.length;
    if (metrics.polyphony > metrics.maxPolyphony) {
        metrics.maxPolyphony = metrics.polyphony;
    }

    const npsWindowStart = Math.max(0, currentVideoTime - 1.0);
    const npsWindowEnd = currentVideoTime;
    let npsCount = 0;

    let npsStartIndex = binarySearchNoteIndex(notes, npsWindowStart);
    let npsEndIndex = binarySearchNoteIndex(notes, npsWindowEnd);

    for (let i = npsStartIndex; i < npsEndIndex; i++) {
        if (notes[i].time >= npsWindowStart && notes[i].time <= npsWindowEnd) {
            npsCount++;
        }
    }

    if (npsEndIndex < notes.length && notes[npsEndIndex].time === currentVideoTime) {
        let i = npsEndIndex;
        while (i < notes.length && notes[i].time === currentVideoTime) {
            npsCount++;
            i++;
        }
    }

    metrics.nps = npsCount;
    if (npsCount > metrics.maxNps) {
        metrics.maxNps = npsCount;
    }

    npsHistory.push(metrics.nps);
    if (npsHistory.length > maxGraphPoints) npsHistory.shift();

    polyphonyHistory.push(metrics.polyphony);
    if (polyphonyHistory.length > maxGraphPoints) polyphonyHistory.shift();

    if (notes[metrics.totalNotes]) {
        metrics.bpm = notes[metrics.totalNotes].bpm;
        currentTicksTrack = Math.floor(notes[metrics.totalNotes].ticks);
    }

}

const FPS = 60;

function resetRenderState() {
    metrics = { totalNotes: 0, polyphony: 0, maxPolyphony: 0, nps: 0, maxNps: 0, bpm: 120 };
    currentTicksTrack = 0;
    currentVideoTime = 0;
    nextNoteIndex = 0;
    activeRenderNotes = [];
    npsHistory = [];
    polyphonyHistory = [];
}

function downloadBlob(blob, ext) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `black_midi_counter_${Date.now()}.${ext}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
}

function finishRender(message) {
    isRendering = false;
    statusMsg.textContent = message;
    recordBtn.disabled = false;
    resetRenderState();
    drawHUDFrame();
}

async function renderWithWebCodecs() {
    const w = canvas.width;
    const h = canvas.height;
    const bitrate = w >= 3840 ? 40000000 : w >= 2560 ? 24000000 : 14000000;

    const codecs = ['avc1.640034', 'avc1.640033', 'avc1.64002A', 'avc1.4D4034', 'avc1.42E01E'];
    let chosen = null;
    for (const codec of codecs) {
        try {
            const res = await VideoEncoder.isConfigSupported({
                codec, width: w, height: h, bitrate, framerate: FPS
            });
            if (res.supported) { chosen = codec; break; }
        } catch (e) {}
    }
    if (!chosen) return false;

    const target = new Mp4Muxer.ArrayBufferTarget();
    const muxer = new Mp4Muxer.Muxer({
        target,
        video: { codec: 'avc', width: w, height: h, frameRate: FPS },
        fastStart: 'in-memory'
    });

    let encodeError = null;
    const encoder = new VideoEncoder({
        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
        error: e => { encodeError = e; }
    });
    encoder.configure({
        codec: chosen, width: w, height: h, bitrate, framerate: FPS,
        bitrateMode: 'variable', latencyMode: 'quality'
    });

    resetRenderState();
    isRendering = true;

    const totalFrames = Math.max(1, Math.ceil(songLengthSec * FPS) + 1);
    const frameDurationUs = Math.round(1e6 / FPS);

    for (let f = 0; f < totalFrames; f++) {
        if (encodeError) throw encodeError;

        currentVideoTime = f / FPS;
        updateStateForTime();
        drawHUDFrame();

        const frame = new VideoFrame(canvas, {
            timestamp: Math.round(f * 1e6 / FPS),
            duration: frameDurationUs
        });
        encoder.encode(frame, { keyFrame: f % (FPS * 2) === 0 });
        frame.close();

        while (encoder.encodeQueueSize > 6) {
            await new Promise(r => setTimeout(r, 1));
        }

        if (f % 30 === 0) {
            const pct = ((f / totalFrames) * 100).toFixed(1);
            statusMsg.textContent = `Rendering: ${pct}% (frame ${f.toLocaleString()} / ${totalFrames.toLocaleString()})`;
            await new Promise(r => setTimeout(r, 0));
        }
    }

    statusMsg.textContent = "Finalizing MP4...";
    await encoder.flush();
    encoder.close();
    muxer.finalize();

    downloadBlob(new Blob([target.buffer], { type: 'video/mp4' }), 'mp4');
    finishRender(`MP4 saved! ${totalFrames.toLocaleString()} frames @ ${FPS}fps = ${formatFormattedTime(totalFrames / FPS)}`);
    return true;
}

function renderWithMediaRecorder() {
    recordedChunks = [];
    const stream = canvas.captureStream(FPS);
    videoTrack = stream.getVideoTracks()[0];

    let options = { mimeType: 'video/mp4; codecs=avc1.42E01E', videoBitsPerSecond: 16000000 };
    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/mp4', videoBitsPerSecond: 16000000 };
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
            options = { mimeType: 'video/webm', videoBitsPerSecond: 16000000 };
        }
    }

    mediaRecorder = new MediaRecorder(stream, options);
    mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
        const isWebm = options.mimeType.includes('webm');
        downloadBlob(new Blob(recordedChunks, { type: isWebm ? 'video/webm' : 'video/mp4' }), isWebm ? 'webm' : 'mp4');
        finishRender("Video saved!");
    };

    resetRenderState();
    isRendering = true;
    mediaRecorder.start();

    const startWall = performance.now();
    function tick() {
        if (!isRendering) return;
        currentVideoTime = (performance.now() - startWall) / 1000;

        if (currentVideoTime >= songLengthSec) {
            currentVideoTime = songLengthSec;
            updateStateForTime();
            drawHUDFrame();
            isRendering = false;
            setTimeout(() => mediaRecorder.stop(), 150);
            return;
        }

        updateStateForTime();
        drawHUDFrame();
        statusMsg.textContent = `Recording in real time: ${((currentVideoTime / songLengthSec) * 100).toFixed(1)}%`;
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
}

function parseMidiFileDirectly(arrayBuffer) {
    const data = new DataView(arrayBuffer);
    let offset = 0;
    let foundHeader = false;

    while (offset + 14 <= data.byteLength) {
        if (
            data.getUint8(offset) === 0x4D &&
            data.getUint8(offset + 1) === 0x54 &&
            data.getUint8(offset + 2) === 0x68 &&
            data.getUint8(offset + 3) === 0x64
        ) {
            foundHeader = true;
            break;
        }
        offset++;
    }

    if (!foundHeader) {
        throw new Error('Invalid signature format. Not a valid MIDI track.');
    }

    const read4Chars = () => {
        if (offset + 4 > data.byteLength) return "";
        return String.fromCharCode(
            data.getUint8(offset++),
            data.getUint8(offset++),
            data.getUint8(offset++),
            data.getUint8(offset++)
        );
    };

    const readUint32 = () => {
        if (offset + 4 > data.byteLength) return 0;
        let val = data.getUint32(offset);
        offset += 4;
        return val;
    };

    const readUint16 = () => {
        if (offset + 2 > data.byteLength) return 0;
        let val = data.getUint16(offset);
        offset += 2;
        return val;
    };

    const readVLQ = () => {
        let value = 0;
        let iterations = 0;
        while (offset < data.byteLength) {
            let b = data.getUint8(offset++);
            value = (value << 7) | (b & 0x7F);
            iterations++;
            if (!(b & 0x80) || iterations > 4) return value;
        }
        return value;
    };

    read4Chars();
    offset += 4;
    const format = readUint16();
    const numTracks = readUint16();
    const ticksPerBeat = readUint16();

    if (ticksPerBeat === 0) {
        throw new Error('Ticks Per Beat syntax layout error.');
    }

    ticksPerBeatTrack = ticksPerBeat;

    let tempoChanges = [{ ticks: 0, bpm: 120, time: 0 }];
    let rawTracks = [];

    for (let t = 0; t < numTracks; t++) {
        if (offset >= data.byteLength) break;
        if (read4Chars() !== 'MTrk') {
            offset += readUint32();
            continue;
        }

        let trackSize = readUint32();
        let trackEndOffset = Math.min(offset + trackSize, data.byteLength);
        let absoluteTicks = 0;
        let runningStatus = 0;
        let trackEvents = [];

        while (offset < trackEndOffset) {
            const prevOffset = offset;
            absoluteTicks += readVLQ();

            if (offset >= data.byteLength) break;
            let status = data.getUint8(offset);

            if (status & 0x80) {
                runningStatus = status;
                offset++;
            } else {
                status = runningStatus;
            }

            let eventType = status & 0xF0;

            if (eventType === 0x80 || eventType === 0x90) {
                let note = data.getUint8(offset++);
                let velocity = data.getUint8(offset++);
                let isNoteOn = eventType === 0x90 && velocity > 0;

                trackEvents.push({
                    ticks: absoluteTicks,
                    type: isNoteOn ? 'noteOn' : 'noteOff',
                    note: note,
                    channel: status & 0x0F
                });
            } else if (eventType === 0xA0 || eventType === 0xB0 || eventType === 0xE0) {
                offset += 2;
            } else if (eventType === 0xC0 || eventType === 0xD0) {
                offset += 1;
            } else if (status === 0xFF) {
                let metaType = data.getUint8(offset++);
                let len = readVLQ();

                if (metaType === 0x51 && len >= 3) {
                    let usPerBeat =
                        (data.getUint8(offset) << 16) |
                        (data.getUint8(offset + 1) << 8) |
                        data.getUint8(offset + 2);

                    tempoChanges.push({
                        ticks: absoluteTicks,
                        bpm: 60000000 / usPerBeat
                    });
                }
                offset += len;
            } else if (status === 0xF0 || status === 0xF7) {
                offset += readVLQ();
            }

            if (offset <= prevOffset) offset++;
        }
        offset = trackEndOffset;
        rawTracks.push(trackEvents);
    }

    tempoChanges.sort((a, b) => a.ticks - b.ticks);
    let cumulativeTime = 0;
    for (let i = 0; i < tempoChanges.length; i++) {
        if (i > 0) {
            let prev = tempoChanges[i - 1];
            let deltaTicks = tempoChanges[i].ticks - prev.ticks;
            cumulativeTime += (deltaTicks / ticksPerBeat) * (60 / prev.bpm);
        }
        tempoChanges[i].time = cumulativeTime;
    }

    function ticksToSeconds(ticks) {
        let i = tempoChanges.length - 1;
        while (i > 0 && tempoChanges[i].ticks > ticks) {
            i--;
        }
        let tc = tempoChanges[i];
        let deltaTicks = ticks - tc.ticks;
        return tc.time + (deltaTicks / ticksPerBeat) * (60 / tc.bpm);
    }

    function ticksToBpm(ticks) {
        let i = tempoChanges.length - 1;
        while (i > 0 && tempoChanges[i].ticks > ticks) {
            i--;
        }
        return tempoChanges[i].bpm;
    }

    let parsedNotes = [];
    let maxSongLength = 0;

    rawTracks.forEach(trackEvents => {
        let activeNotesMap = {};

        for (let ev of trackEvents) {
            let currentSecs = ticksToSeconds(ev.ticks);
            let currentBPM = ticksToBpm(ev.ticks);

            if (ev.type === 'noteOn') {
                let noteKey = `${ev.channel}-${ev.note}`;
                if (activeNotesMap[noteKey]) {
                    activeNotesMap[noteKey].endTime = currentSecs;
                }

                let noteObj = {
                    time: currentSecs,
                    endTime: currentSecs + 999,
                    bpm: currentBPM,
                    ticks: ev.ticks
                };

                parsedNotes.push(noteObj);
                activeNotesMap[noteKey] = noteObj;
            } else if (ev.type === 'noteOff') {
                let noteKey = `${ev.channel}-${ev.note}`;
                if (activeNotesMap[noteKey]) {
                    activeNotesMap[noteKey].endTime = currentSecs;
                    delete activeNotesMap[noteKey];
                }
            }

            if (currentSecs > maxSongLength) {
                maxSongLength = currentSecs;
            }
        }

        for (let key in activeNotesMap) {
            if (activeNotesMap[key].endTime === activeNotesMap[key].time + 999) {
                activeNotesMap[key].endTime = maxSongLength;
            }
        }
    });

    parsedNotes.sort((a, b) => a.time - b.time);

    return { notes: parsedNotes, length: maxSongLength };
}

document.getElementById('midi-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;

    isRendering = false;
    recordBtn.disabled = true;
    statusMsg.textContent = "Reading file entries... Please wait.";

    try {
        const buffer = await file.arrayBuffer();
        statusMsg.textContent = "Processing tracks...";

        const parsedMidi = parseMidiFileDirectly(buffer);
        notes = parsedMidi.notes;
        songLengthSec = parsedMidi.length;

        statusMsg.textContent = `Ready! ${notes.length.toLocaleString()} notes loaded. Duration: ${formatFormattedTime(songLengthSec)}`;
        recordBtn.disabled = false;

        currentVideoTime = 0;
        nextNoteIndex = 0;
        activeRenderNotes = [];
        npsHistory = [];
        polyphonyHistory = [];

        metrics = {
            totalNotes: 0,
            polyphony: 0,
            maxPolyphony: 0,
            nps: 0,
            maxNps: 0,
            bpm: 120
        };

        currentTicksTrack = 0;
        drawHUDFrame();
    } catch(err) {
        statusMsg.textContent = "Error parsing file.";
        alert("Parsing Error: " + err.message);
    }
});

recordBtn.addEventListener('click', async e => {
    e.preventDefault();

    if (recordBtn.disabled || isRendering) return;
    recordBtn.disabled = true;

    const canUseWebCodecs = typeof VideoEncoder !== 'undefined' &&
        typeof VideoFrame !== 'undefined' &&
        typeof Mp4Muxer !== 'undefined';

    try {
        if (canUseWebCodecs) {
            const ok = await renderWithWebCodecs();
            if (ok) return;
        }
        renderWithMediaRecorder();
    } catch (err) {
        console.error(err);
        finishRender("Render failed: " + err.message);
    }
});
