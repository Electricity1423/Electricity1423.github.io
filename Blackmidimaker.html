<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Domino Web - MIDI Sequencer</title>
<script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js" async></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f0f0f0;color:#000;font:12px "Segoe UI","MS UI Gothic",Tahoma,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;touch-action:none}
button,select,input{font:inherit}
#app{display:flex;flex-direction:column;height:100%}
/* menu bar */
#menubar{display:flex;background:#f0f0f0;border-bottom:1px solid #d5d5d5;height:21px;flex:none;position:relative;z-index:50}
#menubar .mi{padding:2px 9px;cursor:default;line-height:17px}
#menubar .mi.open,#menubar .mi:hover{background:#cfe4f8;outline:1px solid #7eb4ea;outline-offset:-1px}
.dd{position:absolute;background:#fff;border:1px solid #979797;box-shadow:2px 3px 4px rgba(0,0,0,.3);min-width:210px;padding:2px;z-index:60}
.dd .it{display:flex;justify-content:space-between;gap:24px;padding:3px 22px 3px 24px;cursor:default;white-space:nowrap;position:relative}
.dd .it:hover{background:#cfe4f8}
.dd .it.dis{color:#999}
.dd .it .ck{position:absolute;left:7px}
.dd .it .k{color:#666}
.dd .sep{height:1px;background:#ddd;margin:3px 2px}
/* toolbars */
.toolbar{display:flex;align-items:center;gap:2px;padding:2px 4px;background:linear-gradient(#f8f8f8,#e8e8e8);border-bottom:1px solid #a0a0a0;flex:none;flex-wrap:wrap}
.tb{min-width:26px;height:26px;padding:0 4px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:3px;cursor:pointer;border-radius:2px;color:#000}
.tb:hover{border-color:#7a8ca8;background:linear-gradient(#fdfeff,#d8e6f6)}
.tb:active,.tb.on{border-color:#3c7fb1;background:linear-gradient(#c3d9f1,#dbe8f7);box-shadow:inset 1px 1px 2px rgba(0,0,0,.25)}
.tb svg{width:16px;height:16px}
.sep1{width:1px;height:22px;background:#a8a8a8;margin:0 4px;box-shadow:1px 0 #fff}
.lcd{background:#fff;border:1px inset #888;min-width:54px;height:20px;padding:0 4px;display:inline-flex;align-items:center;justify-content:flex-end;font:bold 12px Consolas,monospace}
.lbl{font-size:9px;color:#444;font-weight:bold;margin:0 2px 0 4px}
input.num,select.sel{height:22px;border:1px solid #7a7a7a;background:#fff;padding:0 3px}
input.num{width:52px;text-align:right}
.spd{font:bold 10px Tahoma;min-width:24px;padding:0 3px}
/* status strip */
#strip{display:flex;gap:2px;padding:2px 4px;background:#f0f0f0;border-bottom:1px solid #a0a0a0;flex:none;align-items:flex-end}
.sc{width:38px;cursor:pointer}
.sc .sl{background:#000;color:#fff;font:bold 8px Tahoma;text-align:center;height:11px;line-height:11px}
.sc .sv{background:#111;height:14px;position:relative;border-top:1px solid #444}
.sc .sv i{position:absolute;left:0;top:0;bottom:0;background:#d01010}
.sc .sv b{position:absolute;right:2px;top:0;color:#fff;font:bold 10px Consolas,monospace;line-height:14px}
.sc.cur .sl{background:#2a63c9}
#kbd{flex:1;height:26px;margin-left:8px;background:repeating-linear-gradient(90deg,#fff 0 6px,#222 6px 7px);border:1px solid #333;opacity:.8;max-width:420px}
/* main */
#main{flex:1;display:flex;min-height:0}
#evl{width:230px;flex:none;display:flex;flex-direction:column;background:#fff;border-right:1px solid #808080}
#evl .hd{display:grid;grid-template-columns:72px 1fr 44px 56px;background:#f0f0f0;border-bottom:1px solid #a0a0a0;height:20px;line-height:19px;font-size:11px}
#evl .hd div{padding:0 4px;border-right:1px solid #c8c8c8;overflow:hidden}
#evs{flex:1;overflow-y:scroll;position:relative}
#evs .sp{position:absolute;left:0;top:0;width:1px}
#evs .rw{position:absolute;left:0;right:0;height:16px;line-height:16px;display:grid;grid-template-columns:72px 1fr 44px 56px;font:11px Consolas,"MS Gothic",monospace;cursor:default;white-space:nowrap;overflow:hidden}
#evs .rw div{padding:0 4px;overflow:hidden;text-overflow:ellipsis}
#evs .rw.sel{background:#0078d7;color:#fff}
#evs .rw:hover:not(.sel){background:#e5f1fb}
#evs .rw.end{color:#888}
#right{flex:1;min-width:0;display:grid;grid-template-columns:64px 1fr 16px;grid-template-rows:22px 1fr 112px 16px;min-height:0}
.cell{position:relative;overflow:hidden;min-width:0;min-height:0}
#rulerC,#pianoC,#gridC,#ctrlC{position:absolute;left:0;top:0}
#ctrlLab{background:#f0f0f0;border-top:2px solid #808080;display:flex;flex-direction:column;padding:3px;gap:3px;font-size:10px}
#ctrlLab select{width:100%;font-size:10px}
#ctrlWrap{border-top:2px solid #808080}
#hs,#vs{overflow:scroll;background:#f0f0f0}
#hs{grid-column:2;grid-row:4}
#vs{grid-column:3;grid-row:2}
#hs div{height:1px}
#vs div{width:1px}
#status{height:20px;flex:none;background:#f0f0f0;border-top:1px solid #a0a0a0;display:flex;align-items:center;padding:0 8px;gap:14px;font-size:11px;color:#222}
#status a{color:#0645ad;cursor:pointer;text-decoration:underline}
#toast{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* dialogs */
#ovl{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100;display:none;align-items:center;justify-content:center}
.dlg{background:#f0f0f0;border:1px solid #4a6a96;box-shadow:3px 4px 14px rgba(0,0,0,.45);min-width:280px;max-width:96vw;max-height:94vh;display:flex;flex-direction:column}
.dlg .tt{background:linear-gradient(#e9f1fb,#cfdff3);padding:4px 6px 4px 10px;display:flex;justify-content:space-between;align-items:center;font-size:12px;border-bottom:1px solid #9bb3d3}
.dlg .tt span.x{cursor:pointer;width:34px;text-align:center;font-size:14px;line-height:16px}
.dlg .tt span.x:hover{background:#c75050;color:#fff}
.dlg .bd{padding:12px;overflow:auto}
.dlg .ft{display:flex;justify-content:flex-end;gap:8px;padding:8px 12px 12px}
.dlg .ft button{min-width:84px;height:24px;border:1px solid #707070;background:linear-gradient(#f6f6f6,#dcdcdc);border-radius:2px}
.dlg .ft button.def{border-color:#3399ff;box-shadow:inset 0 0 0 1px #6bb5ff}
.dlg .ft button:hover{background:linear-gradient(#eaf6fd,#bee6fd);border-color:#3c7fb1}
.tl{background:#fff;border:1px solid #888;width:320px;height:340px;overflow:auto}
.tl .ti{padding:2px 6px 2px 26px;height:19px;line-height:15px;position:relative;cursor:default;border-bottom:1px dotted #e4e4e4}
.tl .ti:before{content:"";position:absolute;left:6px;top:3px;width:12px;height:11px;background:#4a78c0;border:1px solid #223;border-radius:2px}
.tl .ti.s{background:#0078d7;color:#fff}
.frm{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;align-items:center}
.frm input[type=text],.frm input[type=number],.frm select{width:100%;height:24px;border:1px solid #7a7a7a;padding:0 4px;background:#fff}
</style>
</head>
<body>
<div id="app">
  <div id="menubar"></div>

  <div class="toolbar" id="tb1"></div>
  <div class="toolbar" id="tb2"></div>
  <div id="strip"></div>

  <div id="main">
    <div id="evl">
      <div class="hd"><div>Step</div><div>Event</div><div>Gate</div><div>Vel/Value</div></div>
      <div id="evs"><div class="sp" id="evsp"></div></div>
    </div>
    <div id="right">
      <div class="cell" style="background:#f0f0f0;border-bottom:1px solid #808080"></div>
      <div class="cell" id="rulerWrap" style="border-bottom:1px solid #808080"><canvas id="rulerC"></canvas></div>
      <div class="cell" style="background:#f0f0f0"></div>

      <div class="cell" id="pianoWrap"><canvas id="pianoC"></canvas></div>
      <div class="cell" id="gridWrap"><canvas id="gridC"></canvas></div>
      <div id="vs"><div id="vsin"></div></div>

      <div class="cell" id="ctrlLab"><b>Controller</b><select id="ctrlSel"></select></div>
      <div class="cell" id="ctrlWrap"><canvas id="ctrlC"></canvas></div>
      <div class="cell" style="background:#f0f0f0"></div>

      <div class="cell" style="background:#f0f0f0"></div>
      <div id="hs"><div id="hsin"></div></div>
      <div class="cell" style="background:#f0f0f0"></div>
    </div>
  </div>
  <div id="status"><span id="stTrack"></span><span id="stNotes"></span><span id="stSnap"></span><div id="toast"></div></div>
</div>
<div id="ovl"></div>
<input type="file" id="midiIn" style="display:none">
<input type="file" id="sfIn" style="display:none">

<script>
// ==SMF-START==
/* ---------- Standard MIDI File reader / writer (no external libraries) ---------- */
const CC_TYPES = {
  vol: {label:'VOL',   name:'Volume',     cc:7,    def:100,  max:127},
  exp: {label:'EXP',   name:'Expression', cc:11,   def:127,  max:127},
  pan: {label:'PAN',   name:'Pan',        cc:10,   def:64,   max:127},
  pb:  {label:'P.BEND',name:'Pitch Bend', cc:null, def:8192, max:16383},
  mod: {label:'MOD',   name:'Modulation', cc:1,    def:0,    max:127},
  hold:{label:'HOLD',  name:'Hold',       cc:64,   def:0,    max:127},
  cut: {label:'CUT',   name:'Cutoff',     cc:74,   def:64,   max:127},
  reso:{label:'RESO',  name:'Resonance',  cc:71,   def:64,   max:127},
  rev: {label:'REV',   name:'Reverb',     cc:91,   def:40,   max:127},
  cho: {label:'CHO',   name:'Chorus',     cc:93,   def:0,    max:127},
  dly: {label:'DLY',   name:'Delay',      cc:94,   def:0,    max:127}
};
const CC_BY_NUM = {};
for (const k in CC_TYPES) if (CC_TYPES[k].cc !== null) CC_BY_NUM[CC_TYPES[k].cc] = k;

class ByteBuf {
  constructor(n) { this.a = new Uint8Array(n || 65536); this.n = 0; }
  ensure(k) {
    if (this.n + k > this.a.length) {
      let m = this.a.length * 2; while (m < this.n + k) m *= 2;
      const b = new Uint8Array(m); b.set(this.a.subarray(0, this.n)); this.a = b;
    }
  }
  u8(v) { this.ensure(1); this.a[this.n++] = v & 255; }
  u16(v) { this.u8(v >> 8); this.u8(v); }
  u32(v) { this.u8(v >>> 24); this.u8(v >>> 16); this.u8(v >>> 8); this.u8(v); }
  str(s) { for (let i = 0; i < s.length; i++) this.u8(s.charCodeAt(i)); }
  vlq(v) {
    v = Math.max(0, Math.floor(v));
    const st = [v & 127]; v = Math.floor(v / 128);
    while (v > 0) { st.push((v & 127) | 128); v = Math.floor(v / 128); }
    for (let i = st.length - 1; i >= 0; i--) this.u8(st[i]);
  }
  bytes(arr) { this.ensure(arr.length); for (let i = 0; i < arr.length; i++) this.a[this.n++] = arr[i]; }
  out() { return this.a.subarray(0, this.n); }
}

const SMF = {
  parse(u8) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const str = (o, l) => { let s = ''; for (let i = 0; i < l; i++) s += String.fromCharCode(u8[o + i]); return s; };
    if (u8.length < 14 || str(0, 4) !== 'MThd') throw new Error('Not a standard MIDI file');
    const hl = dv.getUint32(4), fmt = dv.getUint16(8), nt = dv.getUint16(10), div = dv.getUint16(12);
    if (div & 0x8000) throw new Error('SMPTE time division is not supported');
    const out = {
      ppq: div || 480, format: fmt, notes: [], ccs: [], tempos: [], markers: [],
      tracks: [], ts: {num: 4, den: 4}
    };
    const dec = new TextDecoder('utf-8');
    const T = i => { while (out.tracks.length <= i) out.tracks.push({name: '', program: null, bank: null}); return out.tracks[i]; };
    let p = 8 + hl, ti = 0, gotTS = false;
    while (p + 8 <= u8.length && ti < nt) {
      const id = str(p, 4), len = dv.getUint32(p + 4); p += 8;
      const end = Math.min(p + len, u8.length);
      if (id !== 'MTrk') { p = end; continue; }
      ti++;
      let t = 0, status = 0, tname = '', port = 0;
      const open = new Map(), used = new Set();
      while (p < end) {
        let b = u8[p++], delta = b & 127;
        while ((b & 128) && p < end) { b = u8[p++]; delta = delta * 128 + (b & 127); }
        t += delta;
        if (p >= end) break;
        const s = u8[p];
        if (s & 128) { status = s; p++; }
        else if (!status) break;
        if (status === 0xFF) {
          const type = u8[p++]; let l = 0, bb;
          do { bb = u8[p++]; l = l * 128 + (bb & 127); } while ((bb & 128) && p < end);
          if (type === 0x51 && l >= 3) {
            const mpq = (u8[p] << 16) | (u8[p + 1] << 8) | u8[p + 2];
            if (mpq > 0) out.tempos.push({t, bpm: 60000000 / mpq});
          } else if (type === 0x58 && l >= 2 && !gotTS) {
            out.ts = {num: u8[p] || 4, den: Math.pow(2, u8[p + 1])}; gotTS = true;
          } else if (type === 0x21 && l >= 1) {
            port = Math.min(15, u8[p]);
          } else if (type === 0x03) {
            tname = dec.decode(u8.subarray(p, p + l));
          } else if (type === 0x06) {
            out.markers.push({t, text: dec.decode(u8.subarray(p, p + l))});
          }
          p += l; status = 0;
          if (type === 0x2F) break;
          continue;
        }
        if (status === 0xF0 || status === 0xF7) {
          let l = 0, bb;
          do { bb = u8[p++]; l = l * 128 + (bb & 127); } while ((bb & 128) && p < end);
          p += l; status = 0; continue;
        }
        const hi = status & 0xF0, ch = (port << 4) | (status & 15);
        if (hi === 0x90 || hi === 0x80) {
          const pitch = u8[p], vel = u8[p + 1]; p += 2;
          const key = ch * 128 + pitch;
          if (hi === 0x90 && vel > 0) {
            let arr = open.get(key); if (!arr) { arr = []; open.set(key, arr); }
            arr.push({t, v: vel}); used.add(ch);
          } else {
            const arr = open.get(key);
            if (arr && arr.length) {
              const o = arr.shift();
              out.notes.push({ch, p: pitch, t: o.t, d: Math.max(1, t - o.t), v: o.v, sel: false});
            }
          }
        } else if (hi === 0xA0) { p += 2; }
        else if (hi === 0xB0) {
          const cc = u8[p], val = u8[p + 1]; p += 2;
          if (cc === 0) { const tk = T(ch); if (tk.bank === null) tk.bank = val; }
          const type = CC_BY_NUM[cc];
          if (type) { out.ccs.push({ch, type, t, v: val}); used.add(ch); }
        } else if (hi === 0xC0) {
          const pr = u8[p++]; const tk = T(ch); if (tk.program === null) tk.program = pr; used.add(ch);
        } else if (hi === 0xD0) { p += 1; }
        else if (hi === 0xE0) {
          const v = u8[p] | (u8[p + 1] << 7); p += 2;
          out.ccs.push({ch, type: 'pb', t, v}); used.add(ch);
        } else { p++; }
      }
      open.forEach((arr, key) => {
        const ch = key >> 7, pitch = key & 127;
        for (const o of arr) out.notes.push({ch, p: pitch, t: o.t, d: Math.max(1, t - o.t), v: o.v, sel: false});
      });
      used.forEach(c => T(c));
      if (used.size === 1 && tname) { const c = used.values().next().value; const tk = T(c); if (!tk.name) tk.name = tname; }
      p = end;
    }
    out.tempos.sort((a, b) => a.t - b.t);
    const tm = [];
    for (const x of out.tempos) { if (tm.length && tm[tm.length - 1].t === x.t) tm[tm.length - 1] = x; else tm.push(x); }
    if (!tm.length || tm[0].t > 0) tm.unshift({t: 0, bpm: 120});
    out.tempos = tm;
    return out;
  },

  write(proj) {
    const ppq = proj.ppq;
    const enc = new TextEncoder();
    const meta = (t, type, bytes) => {
      const b = new ByteBuf(16); b.vlq(bytes.length);
      return {t, o: 0, s: 0xFF, d: [type].concat(Array.from(b.out()), Array.from(bytes))};
    };
    const writeTrack = (events, endT) => {
      events.sort((a, b) => (a.t - b.t) || (a.o - b.o));
      const tb = new ByteBuf(1 << 16);
      let last = 0, running = 0;
      for (const e of events) {
        tb.vlq(e.t - last); last = e.t;
        if (e.s === 0xFF) { tb.u8(0xFF); tb.bytes(e.d); running = 0; }
        else { if (e.s !== running) { tb.u8(e.s); running = e.s; } tb.bytes(e.d); }
      }
      tb.vlq(Math.max(0, endT - last)); tb.u8(0xFF); tb.u8(0x2F); tb.u8(0);
      return tb.out();
    };
    const tracksOut = [];
    let maxT = 0;
    for (const n of proj.notes) if (n.t + n.d > maxT) maxT = n.t + n.d;
    for (const c of proj.ccs) if (c.t > maxT) maxT = c.t;

    // Conductor track
    const cond = [];
    cond.push(meta(0, 0x03, enc.encode('Conductor')));
    cond.push(meta(0, 0x58, [proj.ts.num, Math.round(Math.log2(proj.ts.den)), 24, 8]));
    for (const tp of proj.tempos) {
      const mpq = Math.max(1, Math.min(0xFFFFFF, Math.round(60000000 / tp.bpm)));
      cond.push(meta(Math.round(tp.t), 0x51, [(mpq >> 16) & 255, (mpq >> 8) & 255, mpq & 255]));
    }
    for (const m of proj.markers) cond.push(meta(Math.round(m.t), 0x06, enc.encode(m.text || '')));
    tracksOut.push(writeTrack(cond, maxT));

    // One track chunk per track (port * 16 + channel); ports > A get a MIDI port-prefix meta event
    const byT = new Map(), grp = i => { let g = byT.get(i); if (!g) { g = {notes: [], ccs: []}; byT.set(i, g); } return g; };
    for (const n of proj.notes) grp(n.ch).notes.push(n);
    for (const c of proj.ccs) grp(c.ch).ccs.push(c);
    const ids = [...byT.keys()].sort((x, y) => x - y);
    for (const idx of ids) {
      const g = byT.get(idx), ch = idx & 15, port = idx >> 4, tr = proj.tracks[idx] || {}, ev = [];
      ev.push(meta(0, 0x03, enc.encode(tr.name || (String.fromCharCode(65 + port) + (ch + 1)))));
      if (port > 0) ev.push(meta(0, 0x21, [port]));
      if (tr.bank && ch !== 9) ev.push({t: 0, o: 1, s: 0xB0 | ch, d: [0, tr.bank & 127]});
      if (tr.vol != null) ev.push({t: 0, o: 1, s: 0xB0 | ch, d: [7, tr.vol & 127]});
      if (tr.pan != null) ev.push({t: 0, o: 1, s: 0xB0 | ch, d: [10, tr.pan & 127]});
      ev.push({t: 0, o: 1, s: 0xC0 | ch, d: [(tr.program || 0) & 127]});
      for (const c of g.ccs) {
        const t = Math.round(c.t);
        if (c.type === 'pb') {
          const v = Math.max(0, Math.min(16383, Math.round(c.v)));
          ev.push({t, o: 2, s: 0xE0 | ch, d: [v & 127, v >> 7]});
        } else {
          ev.push({t, o: 2, s: 0xB0 | ch, d: [CC_TYPES[c.type].cc, Math.max(0, Math.min(127, Math.round(c.v)))]});
        }
      }
      for (const n of g.notes) {
        const t = Math.round(n.t), te = t + Math.max(1, Math.round(n.d));
        const v = Math.max(1, Math.min(127, Math.round(n.v)));
        ev.push({t: te, o: 3, s: 0x90 | ch, d: [n.p, 0]});
        ev.push({t, o: 4, s: 0x90 | ch, d: [n.p, v]});
      }
      tracksOut.push(writeTrack(ev, 0));
    }

    const f = new ByteBuf(1 << 16);
    f.str('MThd'); f.u32(6); f.u16(1); f.u16(tracksOut.length); f.u16(ppq);
    for (const tb of tracksOut) { f.str('MTrk'); f.u32(tb.length); f.bytes(tb); }
    return f.out();
  }
};
// ==SMF-END==

// ==SF2-START==
/* ---------- SoundFont support: SF2 (.sf2) and MIDI.js (.js) fonts ---------- */
class SF2Bank {
  constructor(buffer, name) {
    this.name = name; this.pc = new Map();
    const dv = new DataView(buffer), u8 = new Uint8Array(buffer);
    const tag = o => String.fromCharCode(u8[o], u8[o + 1], u8[o + 2], u8[o + 3]);
    if (buffer.byteLength < 12 || tag(0) !== 'RIFF' || tag(8) !== 'sfbk') throw new Error('Not an SF2 SoundFont');
    const ch = {};
    const walk = (start, end) => {
      let p = start;
      while (p + 8 <= end) {
        const id = tag(p), sz = dv.getUint32(p + 4, true), d = p + 8;
        if (id === 'LIST') walk(d + 4, Math.min(end, d + sz)); else ch[id] = {o: d, n: sz};
        p = d + sz + (sz & 1);
      }
    };

class Domino {

    this.maxDur = 0; this.endTick = 0; this.voices = 0; this.pressed = -1;

  fillPPQ() { const e = document.getElementById('sPPQ'); if (e && document.activeElement !== e) e.value = this.ppq; else if (e) e.value = this.ppq; }

  fillTrackSelects() {
    const s = document.getElementById('sTrack'); s.innerHTML = '';
    const mk = (p, v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; p.appendChild(o); };
    mk(s, -1, 'Conductor');
    for (let pt = 0; pt * 16 < this.tracks.length; pt++) {
      const og = document.createElement('optgroup'); og.label = 'Port ' + String.fromCharCode(65 + pt);
      for (let i = pt * 16; i < Math.min(this.tracks.length, pt * 16 + 16); i++) mk(og, i, this.trackLabel(i));
      s.appendChild(og);
    }
    s.value = this.active;
  }
  trackLabel(i) { const t = this.tracks[i]; return String.fromCharCode(65 + (i >> 4)) + ((i & 15) + 1) + (t && t.name ? ' ' + t.name : ''); }
  defaultTrack(i) { return {name: (i & 15) === 9 ? 'Rhythm' : '', program: 0, bank: 0, engine: this.font ? 'upload' : 'synth', wave: 'gm', mute: false, solo: false, sf: null, hue: null, vol: null, pan: null, trans: 0}; }
  ensureTracks(n) { while (this.tracks.length < n) this.tracks.push(this.defaultTrack(this.tracks.length)); }
  isDrum(i) { return (i & 15) === 9; }
  bankOf(i) { return this.isDrum(i) ? 128 : ((this.tracks[i] && this.tracks[i].bank) || 0); }
  ccDefault(ch, type) {
    const tr = this.tracks[ch];
    if (tr) { if (type === 'vol' && tr.vol != null) return tr.vol; if (type === 'pan' && tr.pan != null) return tr.pan; }
    return CC_TYPES[type].def;
  }
  colorFor(i) {
    const t = this.tracks[i], h = Math.round(((t && t.hue != null) ? t.hue : HUES[i & 15] + (i >> 4) * 11) % 360), cache = this._cc || (this._cc = {});
    let c = cache[h];
    if (!c) { const fill = []; for (let k = 0; k < 16; k++) fill.push(`hsl(${h},75%,${34 + k * 2.6}%)`); c = cache[h] = {fill, line: `hsl(${h},70%,28%)`, base: `hsl(${h},75%,50%)`}; }
    return c;
  }
  /* instrument list for a track: GM names, or the presets of the uploaded SF2 */
  instList(idx) {
    const tr = this.tracks[idx], drum = this.isDrum(idx);
    if (tr.engine === 'upload' && this.font instanceof SF2Bank) {
      const f = this.font, items = [];
      for (let k = 0; k < f.count; k++) { const p = f.phdr[k]; if ((p.bank === 128) === drum) items.push(p); }
      items.sort((x, y) => x.bank - y.bank || x.preset - y.preset);
      const out = items.map(p => ({v: drum ? '' + p.preset : p.bank + ':' + p.preset, label: (drum ? '' : String(p.bank).padStart(3, '0') + ':') + String(p.preset).padStart(3, '0') + '  ' + p.name}));
      const cur = drum ? '' + tr.program : (tr.bank || 0) + ':' + tr.program;
      if (!out.some(x => x.v === cur)) out.unshift({v: cur, label: cur + '  (not in this font)'});
      return {kind: 'sf2', items: out, cur};
    }
    if (drum) return {kind: 'drum', items: [{v: '' + tr.program, label: 'Drum kit (channel 10)'}], cur: '' + tr.program};
    return {kind: 'gm', items: GM.map((g, i) => ({v: '' + i, label: gmLabel(i)})), cur: '' + tr.program};
  }
  setInst(tr, v) { if (String(v).includes(':')) { const [b, p] = v.split(':').map(Number); tr.bank = b; tr.program = p; } else tr.program = +v; tr.sf = null; }
  fillInst() {
    const s = document.getElementById('sInst'); if (!s) return;
    if (this.active < 0 || !this.tracks[this.active]) { s.innerHTML = '<option>-</option>'; s.disabled = true; this._ik = ''; return; }
    const L = this.instList(this.active), tr = this.tracks[this.active], key = [this.active, tr.engine, this.font ? this.font.name : '', L.kind].join('|');
    if (key !== this._ik) { this._ik = key; s.innerHTML = L.items.map(x => `<option value="${escH(x.v)}">${escH(x.label)}</option>`).join(''); }
    s.value = L.cur; s.disabled = L.kind === 'drum';
  }
  applyInst(v) {
    const idx = this.active; if (idx < 0) return;
    this.pushUndo(); const tr = this.tracks[idx]; this.setInst(tr, v);
    if (tr.engine === 'sf') this.loadSF(idx);
    this.playNote(idx, this.isDrum(idx) ? 38 : 60, 100, this.audioNow(), .6, true);
    this.updateToolUI();
  }
  addPort() {
    if (this.tracks.length >= 256) { this.toast('That is the maximum: 16 ports (256 tracks).'); return; }
    this.pushUndo(); const from = this.tracks.length; this.ensureTracks(from + 16);
    for (let i = from; i < from + 16; i++) this.visible.add(i);
    this.active = from; this.fillTrackSelects(); this.touch(); this.updateToolUI();
    const L = String.fromCharCode(65 + (from >> 4));
    this.toast(`Added port ${L} (${L}1 - ${L}16). You now have ${this.tracks.length} tracks. Export writes MIDI port-prefix events for ports above A.`, 9000);
  }
  removePort() {
    if (this.tracks.length <= 16) { this.toast('Port A cannot be removed.'); return; }
    const lo = this.tracks.length - 16;
    if (this.notes.some(n => n.ch >= lo) || this.ccs.some(c => c.ch >= lo)) { this.toast('The last port still has notes or controller events - clear or move them first.'); return; }
    this.pushUndo(); this.tracks.length = lo; if (this.active >= lo) this.active = 0;
    [...this.visible].forEach(i => { if (i >= lo) this.visible.delete(i); });
    this.fillTrackSelects(); this.touch(); this.updateToolUI();
  }
  stepTrack(d) {
    const n = this.tracks.length; this.active = Math.max(0, Math.min(n - 1, this.active < 0 ? 0 : this.active + d));
    this.visible.add(this.active); this.touch(); this.updateToolUI();
    this.toast('Track ' + this.trackLabel(this.active), 2500);
  }
  moveSelDlg() {
    const sel = this.selected(); if (!sel.length) { this.toast('Select some notes first.'); return; }
    const opts = this.tracks.map((t, i) => `<option value="${i}" ${i === this.active ? 'selected' : ''}>${escH(this.trackLabel(i))}</option>`).join('');
    this.dlg('Move notes to track', `<div class="frm"><label>${sel.length.toLocaleString()} selected notes to</label><select id="mvT">${opts}</select></div>`, () => {
      const to = +document.getElementById('mvT').value; if (to === this.active) return true;
      this.pushUndo(); sel.forEach(n => { n.ch = to; n.sel = false; }); this.visible.add(to); this.touch();
      this.toast(sel.length.toLocaleString() + ' notes moved to ' + this.trackLabel(to));
    });
  }

  /* ---------- colors ---------- */
  makeColors() {
    const hues = [212, 128, 28, 330, 270, 180, 12, 84, 240, 50, 300, 160, 0, 200, 110, 350];
    return hues.map(h => {
      const fill = [], line = `hsl(${h},70%,28%)`;
      for (let i = 0; i < 16; i++) fill.push(`hsl(${h},75%,${34 + i * 2.6}%)`);
      return {fill, line, base: `hsl(${h},75%,50%)`};
    });
  }

  /* ---------- coordinate helpers ---------- */
  get pxPerTick() { return this.pxPerQ / this.ppq; }
  t2x(t) { return (t - this.scrollX) * this.pxPerTick; }
  x2t(x) { return x / this.pxPerTick + this.scrollX; }
  p2y(p) { return (127 - p) * this.nh - this.scrollY; }
  y2p(y) { return Math.max(0, Math.min(127, 127 - Math.floor((y + this.scrollY) / this.nh))); }
  ticksPerBar() { return Math.round(this.ppq * 4 * this.ts.num / this.ts.den); }
  ticksPerBeat() { return Math.round(this.ppq * 4 / this.ts.den); }
  snapTicks() { const d = SNAPS[this.snapIdx][1]; if (d === -1) { const c = this.customSnap; return Math.max(1, Math.round(c.mode === 'ticks' ? c.value : this.ppq * 4 / c.value)); } return d ? Math.max(1, Math.round(this.ppq * 4 / d)) : 1; }
  snapFloor(t) { const s = this.snapTicks(); return Math.max(0, Math.floor(t / s) * s); }
  snapNear(t) { const s = this.snapTicks(); return Math.max(0, Math.round(t / s) * s); }
  viewSize() { return {w: this.el.gridC.parentElement.clientWidth, h: this.el.gridC.parentElement.clientHeight}; }

  setScroll(x, y) {
    const {h} = this.viewSize();
    if (x !== undefined) this.scrollX = Math.max(0, x);
    if (y !== undefined) this.scrollY = Math.max(0, Math.min(128 * this.nh - h, y));
    this.requestRender();
  }
  zoomH(f, anchorX) {
    const {w} = this.viewSize(); const ax = anchorX === undefined ? w / 2 : anchorX;
    const tAt = this.x2t(ax);

  zoomV(d) {

  /* ---------- data structure helpers ---------- */
  touchFast() { this.dirty = true; this.ccDirty = true; this.rowsDirty = true; this.requestRender(); this.scheduleList(); }
  touch() { this.dirty = true; this.ccDirty = true; this.tempoDirty = true; this.rowsDirty = true; this.listRender = true; this.requestRender(); this.scheduleList(); }
  ensureSorted() {

  }
  lowerBound(t) {

    return lo;
  }
  range(t0, t1) { this.ensureSorted(); return [this.lowerBound(t0 - this.maxDur), this.lowerBound(t1 + 1)]; }

  ccList(ch, type) {

      this.ccIdx.forEach(a => a.sort((x, y) => x.t - y.t));

  ccAt(ch, type, tick) {

  }
  buildTempo() {
    if (!this.tempoDirty) return;

    if (!this.tempos.length || this.tempos[0].t > 0) this.tempos.unshift({t: 0, bpm: 120});
    const segs = []; let sec = 0;
    for (let i = 0; i < this.tempos.length; i++) {

      segs.push({t: this.tempos[i].t, sec, bpm: this.tempos[i].bpm});

  }
  segIdxT(t) { const s = this.segs; let lo = 0, hi = s.length; while (lo < hi) { const m = (lo + hi) >> 1; if (s[m].t <= t) lo = m + 1; else hi = m; } return Math.max(0, lo - 1); }
  secAtTick(t) { this.buildTempo(); const s = this.segs[this.segIdxT(t)]; return s.sec + (t - s.t) / this.ppq * 60 / s.bpm; }

  activeNotes() { return this.active < 0 ? [] : this.notes.filter(n => n.ch === this.active); }
  selected() { return this.notes.filter(n => n.sel && n.ch === this.active); }

  /* ---------- undo ---------- */
  snapshot() {
    return {
      ppq: this.ppq, notes: this.notes.map(n => ({...n})), ccs: this.ccs.map(c => ({...c})),
      tempos: this.tempos.map(c => ({...c})), markers: this.markers.map(c => ({...c})),
      tracks: this.tracks.map(t => ({name: t.name, program: t.program, bank: t.bank, wave: t.wave, engine: t.engine, mute: t.mute, solo: t.solo, hue: t.hue, vol: t.vol, pan: t.pan, trans: t.trans})), ts: {...this.ts}
    };
  }
  restore(s) {
    this.ppq = s.ppq; this.notes = s.notes; this.ccs = s.ccs; this.tempos = s.tempos; this.markers = s.markers; this.ts = s.ts;
    s.tracks.forEach((t, i) => { if (!this.tracks[i]) this.tracks[i] = this.defaultTrack(i); Object.assign(this.tracks[i], t); });
    this.tracks.length = s.tracks.length; if (this.active >= this.tracks.length) this.active = 0;

  }
  pushUndo() {

  }
  undo() { if (!this.undoS.length) return; this.redoS.push(this.snapshot()); this.restore(this.undoS.pop()); }
  redo() { if (!this.redoS.length) return; this.undoS.push(this.snapshot()); this.restore(this.redoS.pop()); }

  /* ---------- rendering ---------- */
  requestRender() { if (this._raf) return; this._raf = requestAnimationFrame(() => { this._raf = 0; this.draw(); }); }
  prep(c) {
    const dpr = window.devicePixelRatio || 1, p = c.parentElement, w = p.clientWidth, h = p.clientHeight;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) {

  }
  resize() { this.requestRender(); this.scheduleList(); }

  draw() {
    this.ensureSorted(); this.buildTempo();
    this.syncScrollbars();
    this.drawRuler(); this.drawPiano(); this.drawGrid(); this.drawCtrl();
    this.updateStrip(); this.updateReadouts();
    if (this.listRender) { this.listRender = false; this.renderList(); }
  }

  syncScrollbars() {
    const {w, h} = this.viewSize(), hs = this.el.hs, vs = this.el.vs;
    const totalW = Math.min(3e7, (Math.max(this.endTick, this.playTick) + this.ticksPerBar() * 8) * this.pxPerTick + w);
    this.el.hsin.style.width = totalW + 'px';
    this.el.vsin.style.height = (128 * this.nh) + 'px';
    const sl = this.scrollX * this.pxPerTick; if (Math.abs(hs.scrollLeft - sl) > 1) hs.scrollLeft = sl;
    if (Math.abs(vs.scrollTop - this.scrollY) > 1) vs.scrollTop = this.scrollY;
  }

  drawRuler() {
    const {ctx, w, h} = this.prep(this.el.rulerC);
    const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#fbfbfb'); g.addColorStop(1, '#dedede');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const tpb = this.ticksPerBar(), beat = this.ticksPerBeat(), barPx = tpb * this.pxPerTick;
    const t0 = this.x2t(0), t1 = this.x2t(w);
    let step = 1; while (barPx * step < 34) step *= 2;
    ctx.font = '10px Tahoma,sans-serif'; ctx.textBaseline = 'top';
    const b0 = Math.floor(t0 / tpb);
    ctx.strokeStyle = '#8895ad'; ctx.fillStyle = '#222'; ctx.beginPath();
    for (let b = b0 - (b0 % step); b * tpb <= t1; b += step) {
      if (b < 0) continue;
      const x = Math.round(this.t2x(b * tpb)) + .5;
      ctx.moveTo(x, 0); ctx.lineTo(x, h);
    }
    ctx.stroke();
    for (let b = b0 - (b0 % step); b * tpb <= t1; b += step) { if (b >= 0) ctx.fillText(String(b + 1), this.t2x(b * tpb) + 3, 3); }

      ctx.stroke();
    }

      ctx.fillRect(x, h - 11, 2, 11); ctx.fillText(m.text, x + 4, h - 12);
    }

    const px = this.t2x(this.playTick);

  }

  drawPiano() {
    const {ctx, w, h} = this.prep(this.el.pianoC);
    ctx.fillStyle = '#6f6f6f'; ctx.fillRect(0, 0, w, h);
    const nh = this.nh, pLo = this.y2p(h), pHi = Math.min(127, this.y2p(0) + 1);
    const wg = ctx.createLinearGradient(0, 0, w, 0); wg.addColorStop(0, '#d9d9d9'); wg.addColorStop(0.15, '#fff'); wg.addColorStop(1, '#ececec');
    for (let p = Math.max(0, pLo - 1); p <= pHi; p++) {
      if (isBlack(p)) continue;
      const y = this.p2y(p);
      const top = y - (p < 127 && isBlack(p + 1) ? nh / 2 : 0), bot = y + nh + (p > 0 && isBlack(p - 1) ? nh / 2 : 0);
      ctx.fillStyle = p === this.pressed ? '#7fb2ff' : wg; ctx.fillRect(0, top, w, bot - top);
      ctx.fillStyle = '#7c7c7c'; ctx.fillRect(0, bot - 1, w, 1);
      if (p % 12 === 0) { ctx.fillStyle = '#333'; ctx.font = 'bold 10px Tahoma'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic'; ctx.fillText(noteName(p), w - 3, bot - 3); ctx.textAlign = 'left'; }
    }
    const bw = Math.round(w * 0.62);
    for (let p = Math.max(0, pLo - 1); p <= pHi; p++) {
      if (!isBlack(p)) continue;
      const y = this.p2y(p);
      const bg = ctx.createLinearGradient(0, 0, bw, 0);
      if (p === this.pressed) { bg.addColorStop(0, '#2f4f8f'); bg.addColorStop(1, '#7fb2ff'); }
      else { bg.addColorStop(0, '#0e0e0e'); bg.addColorStop(0.65, '#3a3a3a'); bg.addColorStop(0.9, '#8a8a8a'); bg.addColorStop(1, '#bcbcbc'); }

  }

  drawGrid() {
    const {ctx, w, h} = this.prep(this.el.gridC);
    const nh = this.nh, ppt = this.pxPerTick;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    const pLo = this.y2p(h), pHi = Math.min(127, this.y2p(0) + 1);
    for (let p = Math.max(0, pLo - 1); p <= pHi; p++) {
      const y = this.p2y(p);

    }
    ctx.lineWidth = 1; ctx.strokeStyle = '#d3def0'; ctx.beginPath();
    for (let p = Math.max(0, pLo - 1); p <= pHi; p++) { if (p % 12 === 0) continue; const y = Math.round(this.p2y(p) + nh) - .5; ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();
    ctx.strokeStyle = '#7f94bd'; ctx.beginPath();
    for (let p = Math.max(0, pLo - 1); p <= pHi; p++) { if (p % 12 !== 0) continue; const y = Math.round(this.p2y(p) + nh) - .5; ctx.moveTo(0, y); ctx.lineTo(w, y); }

    let s = this.snapTicks(); while (s * ppt < 6) s *= 2;

      for (let k = Math.floor(t0 / s); k * s <= t1; k++) { const x = Math.round(this.t2x(k * s)) + .5; ctx.moveTo(x, 0); ctx.lineTo(x, h); }
      ctx.stroke();
    }
    if (beat * ppt >= 6) {
      ctx.strokeStyle = '#bcc8de'; ctx.beginPath();
      for (let k = Math.floor(t0 / beat); k * beat <= t1; k++) { const x = Math.round(this.t2x(k * beat)) + .5; ctx.moveTo(x, 0); ctx.lineTo(x, h); }
      ctx.stroke();
    }
    ctx.strokeStyle = '#5f7096'; ctx.beginPath();
    let bs = 1; while (tpb * ppt * bs < 6) bs *= 2;
    for (let k = Math.floor(t0 / tpb); k * tpb <= t1; k++) { if (k % bs) continue; const x = Math.round(this.t2x(k * tpb)) + .5; ctx.moveTo(x, 0); ctx.lineTo(x, h); }

        const col = this.colorFor(n.ch);

        const x0 = Math.max(-2, x), w0 = Math.max(1, Math.min(nw, w + 2 - x0) - (x < -2 ? 0 : 0));
        ctx.fillRect(x, y + 1, Math.max(1, nw - (nw > 2 ? 1 : 0)), nh - 1);
        if (detailed && nw > 3) { ctx.strokeStyle = n.sel && isAct ? '#7a4d00' : col.line; ctx.strokeRect(x + .5, y + 1.5, nw - 2, nh - 3); }
        if (pass === 1 && this.showNames && nw > 30 && nh >= 11 && detailed) { ctx.fillStyle = n.sel ? '#222' : '#fff'; ctx.font = '9px Tahoma'; ctx.textBaseline = 'middle'; ctx.fillText(noteName(n.p), Math.max(x, 0) + 3, y + nh / 2 + 1); }
      }
    }
    ctx.globalAlpha = 1;
    if (this.pasting && this.clip.length) {
      const g = this.pasting, f = this.clipFirst(), dp = g.p - f.p, lim = Math.min(this.clip.length, 20000);
      ctx.globalAlpha = 0.72;
      for (let i = 0; i < lim; i++) {
        const c = this.clip[i], x = this.t2x(g.t + c.dt), nw = Math.max(2, c.d * ppt), y = this.p2y(Math.max(0, Math.min(127, c.p + dp)));
        if (x + nw < 0 || x > w || y + nh < 0 || y > h) continue;
        ctx.fillStyle = '#ffd34d'; ctx.fillRect(x, y + 1, nw, nh - 1); ctx.strokeStyle = '#d02020'; ctx.strokeRect(x + .5, y + 1.5, Math.max(1, nw - 1), nh - 3);

  }

  ctrlMax() {
    if (this.ctrl === 'vel') return 127;
    if (this.ctrl === 'tempo') { let m = 240; for (const t of this.tempos) if (t.bpm > m) m = t.bpm * 1.1; return Math.ceil(m); }
    return CC_TYPES[this.ctrl].max;
  }
  ctrlMin() { return this.ctrl === 'tempo' ? 20 : 0; }

  drawCtrl() {
    const {ctx, w, h} = this.prep(this.el.ctrlC);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    const ppt = this.pxPerTick, t0 = this.x2t(0), t1 = this.x2t(w), tpb = this.ticksPerBar();
    ctx.strokeStyle = '#e2e8f3'; ctx.beginPath();
    for (let i = 1; i < 4; i++) { const y = Math.round(h * i / 4) + .5; ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();
    ctx.strokeStyle = '#a3b2d0'; ctx.beginPath(); let bs = 1; while (tpb * ppt * bs < 6) bs *= 2;
    for (let k = Math.floor(t0 / tpb); k * tpb <= t1; k++) { if (k % bs) continue; const x = Math.round(this.t2x(k * tpb)) + .5; ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    ctx.stroke();
    const max = this.ctrlMax(), min = this.ctrlMin(), vy = v => h - 3 - (v - min) / (max - min) * (h - 8);
    if (this.ctrl === 'vel') {
      if (this.active >= 0) {
        const [i0, i1] = this.range(t0, t1), N = this.notes, col = this.colorFor(this.active);
        for (let i = i0; i < i1; i++) {
          const n = N[i]; if (n.ch !== this.active) continue;
          const x = Math.round((n.t - this.scrollX) * ppt); if (x < -3 || x > w + 3) continue;
          const y = vy(n.v);
          ctx.fillStyle = n.sel ? '#e0a000' : col.base; ctx.fillRect(x, y, 3, h - y);
          ctx.fillStyle = '#222'; ctx.fillRect(x - 1, y - 1, 5, 2);
        }
      }
    } else {
      let pts;
      if (this.ctrl === 'tempo') pts = this.tempos;
      else pts = this.active >= 0 ? this.ccList(this.active, this.ctrl) : [];
      const def = this.ctrl === 'tempo' ? pts[0].bpm : this.ccDefault(this.active, this.ctrl);
      const val = p => this.ctrl === 'tempo' ? p.bpm : p.v;
      ctx.fillStyle = 'rgba(80,130,220,.25)'; ctx.strokeStyle = '#2a5db0'; ctx.lineWidth = 1.5;
      ctx.beginPath(); let curV = def, started = false, lastX = 0;
      let startIdx = 0; while (startIdx < pts.length && pts[startIdx].t < t0) { curV = val(pts[startIdx]); startIdx++; }
      ctx.moveTo(0, vy(curV)); lastX = 0;
      const pathPts = [];
      for (let i = startIdx; i < pts.length && pts[i].t <= t1 + 1; i++) {
        const x = this.t2x(pts[i].t), y = vy(val(pts[i]));
        ctx.lineTo(x, vy(curV)); ctx.lineTo(x, y); curV = val(pts[i]); lastX = x; pathPts.push([x, y]);
      }
      ctx.lineTo(w, vy(curV)); ctx.stroke();
      ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e07000'; for (const [x, y] of pathPts) ctx.fillRect(x - 2, y - 2, 4, 4);
    }
    ctx.fillStyle = '#555'; ctx.font = '9px Tahoma'; ctx.textBaseline = 'top';
    ctx.fillText(String(max), 3, 2); ctx.textBaseline = 'bottom'; ctx.fillText(String(min), 3, h - 2);
    const px = Math.round(this.t2x(this.playTick)) + .5; ctx.strokeStyle = '#e02020'; ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px, h); ctx.stroke();
  }

  updateStrip() {
    const cells = this.el.strip.querySelectorAll('.sc');
    const ch = this.active >= 0 ? this.active : 0;
    cells.forEach(c => {
      const t = c.dataset.t; let v, max;
      if (t === 'vel') { v = this.vel; max = 127; }
      else { v = this.ccAt(ch, t, this.playTick); max = CC_TYPES[t].max; }
      c.querySelector('b').textContent = t === 'pb' ? v - 8192 : Math.round(v);
      c.querySelector('i').style.width = (t === 'pb' || t === 'pan' ? 0 : (v / max * 100)) + '%';
      c.classList.toggle('cur', t === this.ctrl);
    });
  }

  updateReadouts() {
    const tpb = this.ticksPerBar(), t = Math.floor(this.playTick);
    document.getElementById('lMeas').textContent = (Math.floor(t / tpb) + 1) + ': ' + (t % tpb);
    const ti = document.getElementById('iTempo'); if (document.activeElement !== ti) ti.value = (Math.round(this.tempoAt(this.playTick) * 100) / 100);
    document.getElementById('stNotes').textContent = 'Notes: ' + this.notes.length.toLocaleString();
    document.getElementById('stTrack').textContent = 'Track: ' + (this.active < 0 ? 'Conductor' : this.trackLabel(this.active));
    document.getElementById('stSnap').textContent = 'Snap: ' + this.snapTicks() + ' ticks';
  }
  status() { this.updateToolUI(); this.updateReadouts(); }
  updateToolUI() {
    ['select', 'pencil', 'eraser', 'brush', 'hand'].forEach(n => document.getElementById('t-' + n).classList.toggle('on', this.tool === n));
    document.getElementById('bFollow').classList.toggle('on', this.follow);
    document.querySelectorAll('.spd').forEach(b => b.classList.toggle('on', parseFloat(b.dataset.spd) === this.speed));
    this.el.ctrlSel.value = this.ctrl;
    document.getElementById('sTrack').value = this.active;
    this.fillInst();
  }
  toast(html, ms) {
    this.el.toast.innerHTML = html; clearTimeout(this._tt);
    this._tt = setTimeout(() => { this.el.toast.innerHTML = ''; }, ms || 6000);
  }

  /* ---------- event list ---------- */

    if (this.active < 0) {
      for (const t of this.tempos) rows.push({t: t.t, k: 0, txt: 'Tempo', g: '', v: Math.round(t.bpm * 100) / 100});

    } else {

    sc.querySelectorAll('.rw').forEach(e => e.remove());

        else d.innerHTML = `<div>${this.stepText(r.t)}</div><div>${r.txt}</div><div>${r.g}</div><div>${r.v}</div>`;

  /* ---------- tools & input ---------- */

  localXY(e, c) { const r = c.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; }

  keyPress(p) {

  gridDown(e) {

  audioNow() { this.initAudio(); return this.ac.currentTime; }

  gridMove(e) {

  /* ---------- controller lane editing ---------- */
  ctrlValueAt(y) {

  }
  ctrlDown(e) {

  ctrlMove(e) {

  /* ---------- keyboard ---------- */
  keyDown(e) {

    if (document.getElementById('ovl').style.display === 'flex') { if (e.key === 'Escape') this.closeDlg(); return; }
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? this.redo() : this.undo(); }
    else if (mod && k === 'y') { e.preventDefault(); this.redo(); }
    else if (mod && k === 'c') { e.preventDefault(); this.copy(); }
    else if (mod && k === 'x') { e.preventDefault(); this.cut(); }
    else if (mod && k === 'v') { e.preventDefault(); this.paste(); }
    else if (mod && k === 'a') { e.preventDefault(); this.selectAll(); }
    else if (mod && k === 'd') { e.preventDefault(); this.duplicate(); }
    else if (mod && k === 's') { e.preventDefault(); this.exportMidi(); }
    else if (mod && k === 'o') { e.preventDefault(); this.el.midiIn.click(); }
    else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); this.deleteSel(); }
    else if (e.key === ' ') { e.preventDefault(); this.playing ? this.pause() : this.play(); }
    else if (e.key === 'Home') { this.seek(0); this.setScroll(0); }
    else if (e.key === 'ArrowUp' && !mod) { e.preventDefault(); this.transpose(e.shiftKey ? 12 : 1); }
    else if (e.key === 'ArrowDown' && !mod) { e.preventDefault(); this.transpose(e.shiftKey ? -12 : -1); }
    else if (e.key === 'ArrowLeft' && !mod) { e.preventDefault(); this.nudge(-1); }
    else if (e.key === 'ArrowRight' && !mod) { e.preventDefault(); this.nudge(1); }
    else if (e.key === ']') this.stepTrack(1);
    else if (e.key === '[') this.stepTrack(-1);
    else if (e.key === '+' || e.key === '=') this.zoomH(1.25);
    else if (e.key === '-') this.zoomH(0.8);
    else if (e.key === 'Escape') { if (this.pasting) { this.pasting = null; this.requestRender(); } else this.selectNone(); }
  }

  /* ---------- editing operations ---------- */
  selectAll() { this.notes.forEach(n => n.sel = n.ch === this.active); this.listRender = true; this.requestRender(); }
  selectNone() { this.notes.forEach(n => n.sel = false); this.listRender = true; this.requestRender(); }
  deleteSel() {
    if (!this.selected().length) return; this.pushUndo();
    this.notes = this.notes.filter(n => !(n.sel && n.ch === this.active)); this.touch();
  }
  copy() {
    const s = this.selected(); if (!s.length) return;
    const m = Math.min(...s.map(n => n.t));
    this.clip = s.map(n => ({p: n.p, dt: n.t - m, d: n.d, v: n.v}));
    this.toast(s.length + ' notes copied - press Paste (Ctrl+V), move them, and click to place.');
  }
  cut() { this.copy(); this.deleteSel(); }
  clipFirst() { return this.clip.reduce((a, b) => (b.dt < a.dt || (b.dt === a.dt && b.p < a.p)) ? b : a); }
  paste() {
    if (!this.clip.length) { this.toast('Nothing copied yet - select notes and press Copy first.'); return; }
    if (this.active < 0) return;
    const f = this.clipFirst();
    this.pasting = {t: this.snapFloor(this.playTick), p: f.p};
    this.toast('Move the copied notes, then click (or tap) to place them. Shift+click keeps pasting; Esc or right-click cancels.', 15000);
    this.requestRender();
  }
  updatePasteGhost(x, y) { const g = this.pasting; if (!g) return; g.t = this.snapNear(this.x2t(x)); g.p = this.y2p(y); this.requestRender(); }
  placePaste() {
    const g = this.pasting; if (!g || !this.clip.length) return;
    this.pushUndo(); this.notes.forEach(n => n.sel = false);
    const dp = g.p - this.clipFirst().p;
    for (const c of this.clip) this.notes.push({ch: this.active, p: Math.max(0, Math.min(127, c.p + dp)), t: g.t + c.dt, d: c.d, v: c.v, sel: true});
    this.touch();
  }
  duplicate() { if (!this.selected().length) { this.toast('Select some notes first.'); return; } this.copy(); this.paste(); }
  transpose(d) {
    const s = this.selected(); if (!s.length) return; this.pushUndo();
    s.forEach(n => n.p = Math.max(0, Math.min(127, n.p + d))); this.touch();
    this.playNote(this.active, s[0].p, s[0].v, this.audioNow(), 0.15, true);
  }
  nudge(dir) {
    const s = this.selected(); if (!s.length) return; this.pushUndo();
    const st = this.snapTicks(); s.forEach(n => n.t = Math.max(0, n.t + dir * st)); this.touch();
  }
  quantizeSel() { const s = this.selected(); if (!s.length) return; this.pushUndo(); s.forEach(n => n.t = this.snapNear(n.t)); this.touch(); }
  randVel() { const s = this.selected(); if (!s.length) return; this.pushUndo(); s.forEach(n => n.v = 70 + Math.floor(Math.random() * 58)); this.touch(); }
  setGateSel() { const s = this.selected(); if (!s.length) return; this.pushUndo(); s.forEach(n => n.d = this.gate); this.touch(); }
  clearTrack() {
    if (this.active < 0) return; if (!confirm('Clear all events on ' + this.trackLabel(this.active) + '?')) return;
    this.pushUndo(); this.notes = this.notes.filter(n => n.ch !== this.active); this.ccs = this.ccs.filter(c => c.ch !== this.active); this.touch();
  }
  addMarker() {
    this.dlg('Add marker', `<div class="frm"><label>Text</label><input type="text" id="dMk" value="Marker"></div>`, () => {
      const t = document.getElementById('dMk').value; this.pushUndo(); this.markers.push({t: Math.round(this.playTick), text: t}); this.requestRender(); return true;
    });
  }
  newProject() {
    if (this.notes.length && !confirm('Discard the current project?')) return;
    this.stop(); this.notes = []; this.ccs = []; this.markers = []; this.tempos = [{t: 0, bpm: 120}]; this.ts = {num: 4, den: 4};
    this.tracks.length = 0; this.ensureTracks(16);
    this.undoS = []; this.redoS = []; this.fileName = ''; this.playTick = 0; this.scrollX = 0; this.active = 0; this.visible = new Set(this.tracks.keys());
    this.syncTimeSig(); this.fillTrackSelects(); this.touch(); this.updateToolUI();
  }
  syncTimeSig() { document.getElementById('iNum').value = this.ts.num; document.getElementById('sDen').value = this.ts.den; }
  changePPQ(n) {
    if (n === this.ppq) return; this.pushUndo(); const r = n / this.ppq;
    this.notes.forEach(x => { x.t = Math.round(x.t * r); x.d = Math.max(1, Math.round(x.d * r)); });
    this.ccs.forEach(x => x.t = Math.round(x.t * r)); this.tempos.forEach(x => x.t = Math.round(x.t * r)); this.markers.forEach(x => x.t = Math.round(x.t * r));
    this.scrollX *= r; this.playTick *= r; this.gate = Math.max(1, Math.round(this.gate * r)); this.ppq = n;
    document.getElementById('iGate').value = this.gate; this.touch();
  }

  patternDlg() {
    if (this.active < 0) { this.toast('Select a track (A1, B1, ...) first - the Conductor has no notes.'); return; }
    const html = `<div class="frm">
      <label>Pattern</label><select id="gP"><option value="stream">Dense stream (random burst)</option><option value="stairs">Staircase cascades</option><option value="wall">Wall of sound (chord stack)</option><option value="arp">Arpeggio rain</option></select>
      <label>Total notes</label><input type="number" id="gN" value="2000" min="1" max="2000000">
      <label>Spacing</label><select id="gS"><option value="16">1/16</option><option value="32">1/32</option><option value="64">1/64</option><option value="128" selected>1/128</option><option value="256">1/256</option><option value="512">1/512</option><option value="1024">1/1024</option></select>

    </div><p style="font-size:11px;color:#444;margin:10px 0 0">Notes are inserted on ${this.trackLabel(this.active)} starting at the cursor.</p>`;

      const type = document.getElementById('gP').value, count = Math.max(1, Math.min(2e6, +document.getElementById('gN').value || 1000));
      const div = +document.getElementById('gS').value, ctr = +document.getElementById('gC').value, sp = Math.max(1, +document.getElementById('gO').value || 2), per = Math.max(1, +document.getElementById('gK').value || 1);
      const step = Math.max(1, Math.round(this.ppq * 4 / div)); let t = this.snapFloor(this.playTick);
      this.pushUndo(); this.notes.forEach(n => n.sel = false);
      const arp = [0, 4, 7, 11, 12, 16, 19, 23], range = sp * 12;
      let made = 0, i = 0;
      while (made < count) {

          let p;
          if (type === 'stream') p = ctr + Math.floor((Math.random() - 0.5) * range);
          else if (type === 'stairs') p = ctr - (range >> 1) + ((i * per + k) % range);

    });

  /* ---------- audio ---------- */
  initAudio() {
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext; this.ac = new AC({latencyHint: 'interactive'});
    this.master = this.ac.createGain(); this.master.gain.value = 0.7;
    const comp = this.ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
    this.master.connect(comp); comp.connect(this.ac.destination);
    const nb = this.ac.createBuffer(1, this.ac.sampleRate, this.ac.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this.noise = nb;
    this.tracks.forEach((t, i) => { if (t.engine === 'sf') this.loadSF(i); });
  }
  loadSF(ch) {
    if (!window.Soundfont) { this.toast('SoundFont library not loaded (offline?) - using built-in synth.'); return; }
    this.initAudio();
    const t = this.tracks[ch], name = GM[t.program];
    window.Soundfont.instrument(this.ac, name, {soundfont: 'MusyngKite', destination: this.master}).then(p => { t.sf = p; }).catch(() => this.toast('Could not load SoundFont "' + name + '"'));
  }
  refreshSolo() { this._solo = this.tracks.some(t => t.solo); }
  audible(ch) {
    const t = this.tracks[ch]; if (!t || t.mute) return false;
    return !(this._solo && !t.solo);
  }
  route(g, pan) {
    const ac = this.ac, nodes = [g];
    if (pan !== 64 && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, (pan - 64) / 64)); g.connect(p); p.connect(this.master); nodes.push(p); }
    else g.connect(this.master);
    return nodes;
  }
  playNote(ch, pitch, vel, when, dur, preview) {
    const tr = this.tracks[ch]; if (!this.ac || !tr) return;
    if (preview) this.refreshSolo();
    if (!this.audible(ch) || this.voices > 300) return;
    const t0 = Math.max(when, this.ac.currentTime), tick = preview ? this.playTick : this._curTick || 0, drum = (ch & 15) === 9;
    dur = Math.max(0.03, dur);
    const vol = this.ccAt(ch, 'vol', tick) / 127, ex = this.ccAt(ch, 'exp', tick) / 127, pan = Math.round(this.ccAt(ch, 'pan', tick));
    const amp = Math.pow(vel / 127, 1.4) * 0.22 * vol * ex;
    if (!drum && tr.trans) pitch = Math.max(0, Math.min(127, pitch + tr.trans));
    if (tr.engine === 'upload' && this.font) { this.font.play(this.ac, this.master, this.bankOf(ch), tr.program, pitch, vel, t0, dur, amp, this); return; }
    if (drum) return this.drum(pitch, amp, t0, pan);
    if (tr.engine === 'sf' && tr.sf) { try { tr.sf.play(pitch, t0, {duration: dur, gain: Math.min(1, amp * 5)}); } catch (e) {} return; }
    this.synthNote(tr.wave && tr.wave !== 'gm' ? -1 : tr.program, tr.wave, pitch, amp, t0, dur, pan);
  }
  synthNote(prog, wave, pitch, amp, t0, dur, pan) {
    const ac = this.ac, f = 440 * Math.pow(2, (pitch - 69) / 12);
    const P = prog >= 0 ? patchFor(prog) : {o: [[wave, 1, 1]], a: .004, dec: 1, s: .35, r: .12};
    const g = ac.createGain(), a = P.a, pk = amp * (P.g || 1);
    let sink = g, filt = null;
    if (P.lp) {
      filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.Q.value = P.q || 0.7;
      const clampF = x => Math.max(120, Math.min(16000, x)), f0 = clampF(f * P.lp);
      if (P.sweep) { filt.frequency.setValueAtTime(f0 * 0.3, t0); filt.frequency.linearRampToValueAtTime(f0, t0 + a + 0.1); }
      else if (P.lpEnd) { filt.frequency.setValueAtTime(f0, t0); filt.frequency.setTargetAtTime(clampF(f * P.lpEnd), t0, Math.max(.02, P.dec / 3)); }
      else filt.frequency.value = f0;
      filt.connect(g); sink = filt;
    }
    const oscs = [];
    for (const [type, ratio, gain, det] of P.o) {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = Math.min(20000, f * ratio); if (det) o.detune.value = det;
      if (P.o.length > 1 || gain !== 1) { const og = ac.createGain(); og.gain.value = gain; o.connect(og); og.connect(sink); } else o.connect(sink);
      oscs.push(o);
    }
    g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(pk, t0 + a);
    if (P.s < 1) g.gain.setTargetAtTime(pk * P.s, t0 + a, Math.max(0.005, P.dec / 3));
    const te = Math.max(t0 + dur, t0 + a + 0.01), rel = Math.max(0.03, P.r);
    g.gain.setTargetAtTime(0, te, rel / 3);
    const stopT = te + rel * 1.8 + 0.05, nodes = this.route(g, pan); this.voices++;
    let left = oscs.length;
    for (const o of oscs) { o.start(t0); o.stop(stopT); o.onended = () => { if (--left === 0) { this.voices--; nodes.forEach(x => x.disconnect()); if (filt) filt.disconnect(); } }; }
  }
  drum(pitch, amp, t0, pan) {
    const ac = this.ac, g = ac.createGain(), nodes = this.route(g, pan === undefined ? 64 : pan); let left = 0; this.voices++;
    const fin = () => { if (--left === 0) { this.voices--; nodes.forEach(x => x.disconnect()); } };
    const tone = (type, f0, f1, len, gain) => {
      const o = ac.createOscillator(), e = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t0);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + len * 0.6);
      e.gain.setValueAtTime(gain, t0); e.gain.exponentialRampToValueAtTime(0.0002, t0 + len);
      o.connect(e); e.connect(g); o.start(t0); o.stop(t0 + len + 0.02); left++; o.onended = fin;
    };
    const noise = (ft, fq, len, gain, q, off) => {
      const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), e = ac.createGain(), ts = t0 + (off || 0); s.buffer = this.noise; fl.type = ft; fl.frequency.value = fq; if (q) fl.Q.value = q;
      e.gain.setValueAtTime(gain, ts); e.gain.exponentialRampToValueAtTime(0.0002, ts + len);
      s.connect(fl); fl.connect(e); e.connect(g); s.start(ts, Math.random() * 0.5); s.stop(ts + len + 0.02); left++; s.onended = fin;
    };
    g.gain.value = amp * 2.4;
    switch (pitch) {
      case 35: case 36: tone('sine', 160, 45, .28, 1.2); noise('lowpass', 800, .03, .3); break;
      case 38: case 40: tone('triangle', 190, 120, .12, .6); noise('highpass', 1500, .2, .9); break;
      case 37: tone('square', 400, 380, .03, .4); noise('bandpass', 2500, .04, .5); break;
      case 39: noise('bandpass', 1300, .04, 1, 1.5); noise('bandpass', 1300, .04, 1, 1.5, .012); noise('bandpass', 1300, .16, 1, 1.5, .024); break;
      case 41: case 43: case 45: case 47: case 48: case 50: { const tf = {41: 80, 43: 100, 45: 120, 47: 145, 48: 170, 50: 200}[pitch]; tone('sine', tf * 1.8, tf, .32, 1); noise('bandpass', 1000, .04, .3); break; }
      case 42: case 44: noise('highpass', 8000, .05, .7); break;
      case 46: noise('highpass', 7500, .3, .7); break;
      case 49: case 52: case 55: case 57: noise('highpass', 5500, 1.2, .8); break;
      case 51: case 53: case 59: noise('highpass', 7000, .6, .5); tone('triangle', 420, 420, .35, .15); break;
      case 54: noise('highpass', 9000, .12, .6); break;
      case 56: tone('square', 560, 560, .25, .4); tone('square', 845, 845, .25, .4); break;
      case 69: case 70: noise('highpass', 6000, .06, .5); break;
      case 75: tone('sine', 2500, 2500, .04, .8); break;
      case 76: case 77: tone('sine', pitch === 76 ? 900 : 700, pitch === 76 ? 900 : 700, .06, .8); break;
      default: noise('bandpass', 1800, .16, .8);
    }
  }
  setSpeed(s) {
    const was = this.playing; if (was) this.pause(); this.speed = s; this.updateToolUI(); if (was) this.play();
  }
  seek(t) {
    const was = this.playing; if (was) this.pause(); this.playTick = Math.max(0, t); if (was) this.play(); this.requestRender();
  }
  play() {
    if (this.playing) return; this.initAudio(); this.ac.resume(); this.ensureSorted(); this.buildTempo();
    this.playing = true; this.pbTick = this.playTick; this.pbSec = this.secAtTick(this.playTick); this.pbAc = this.ac.currentTime + 0.08;
    this.nextIdx = this.lowerBound(this.playTick);
    this.timer = setInterval(() => this.schedule(), 20); this.schedule();
    const loop = () => {
      if (!this.playing) return;
      const song = this.pbSec + (this.ac.currentTime - this.pbAc) * this.speed;
      this.playTick = Math.max(this.pbTick, this.tickAtSec(song));
      if (this.follow) {
        const {w} = this.viewSize(), x = this.t2x(this.playTick);
        if (x > w * 0.92 || x < 0) this.scrollX = Math.max(0, this.playTick - w * 0.06 / this.pxPerTick);
      }
      if (this.playTick > this.endTick + this.ppq * 2 && this.notes.length) { this.stop(false); return; }
      this.draw(); requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  schedule() {
    if (!this.playing) return;
    this.refreshSolo();
    const ac = this.ac, nowSong = this.pbSec + (ac.currentTime - this.pbAc) * this.speed;
    const horizon = nowSong + 0.14 * this.speed, N = this.notes; let guard = 0;
    while (this.nextIdx < N.length) {
      const n = N[this.nextIdx], ns = this.secAtTick(n.t);
      if (ns > horizon) break; this.nextIdx++;
      if (ns < nowSong - 0.25) continue;
      if (guard++ > 500 || !this.audible(n.ch)) continue;
      const when = this.pbAc + (ns - this.pbSec) / this.speed, dur = (this.secAtTick(n.t + n.d) - ns) / this.speed;
      this._curTick = n.t; this.playNote(n.ch, n.p, n.v, when, dur, false);
    }
  }
  pause() { if (!this.playing) return; this.playing = false; clearInterval(this.timer); this.requestRender(); }
  stop(reset = true) { this.pause(); if (reset) { this.playTick = 0; } this.requestRender(); }

  async makeFont(name, blob) {
    this.initAudio();
    return /\.(sf2|sf3)$/i.test(name) ? new SF2Bank(await blob.arrayBuffer(), name) : await MidiJsFont.load(this.ac, await blob.text(), name);
  }
  useFont(font) { this.font = font; this.tracks.forEach(t => t.engine = 'upload'); this._ik = ''; this.touch(); this.updateToolUI(); }
  async saveFont(name, blob) {
    const rec = {name, size: blob.size, added: Date.now(), data: blob};
    try { await FontDB.put(rec); } catch (e) { rec.data = await blob.arrayBuffer(); await FontDB.put(rec); }
    await FontDB.setMeta('active', name);
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  }
  async loadFont(file) {
    this.toast('Loading SoundFont ' + file.name + ' ...', 120000);
    let font;
    try {
      this.initAudio(); if (this.ac.state === 'suspended') this.ac.resume();
      await new Promise(r => setTimeout(r, 20));
      font = await this.makeFont(file.name, file);
      const used = new Set(this.notes.map(n => n.ch)); used.add(this.active >= 0 ? this.active : 0);
      for (const ch of used) { try { if (this.tracks[ch]) font.warm(this.ac, this.bankOf(ch), this.tracks[ch].program); } catch (e) { console.warn(e); } }
      this.useFont(font);
    } catch (err) { console.error(err); this.toast('SoundFont load failed: ' + err.message, 12000); return; }
    const info = font.count + (font instanceof SF2Bank ? ' presets' : ' notes');
    try {
      await this.saveFont(file.name, file);
      this.toast('SoundFont loaded (' + info + ') and saved on this device - it will load automatically next time.', 12000);
    } catch (err) {
      console.warn(err);
      this.toast('SoundFont loaded (' + info + '), but it could not be saved for next time (' + err.message + '). Storage may be blocked or full.', 14000);
    }
  }
  async restoreFont() {
    try {
      const name = await FontDB.getMeta('active'); if (!name) return;
      const rec = await FontDB.get(name); if (!rec) return;
      this.toast('Restoring saved SoundFont ' + name + ' ...', 120000);
      const font = await this.makeFont(name, rec.data instanceof Blob ? rec.data : new Blob([rec.data]));
      this.useFont(font);
      this.toast('SoundFont restored: ' + name, 6000);
    } catch (err) { console.warn(err); this.toast('Could not restore the saved SoundFont: ' + err.message, 10000); }
  }
  async useSaved(name) {
    this.toast('Loading ' + name + ' ...', 120000);
    try {
      const rec = await FontDB.get(name); if (!rec) throw new Error('not found');
      const font = await this.makeFont(name, rec.data instanceof Blob ? rec.data : new Blob([rec.data]));
      this.useFont(font); await FontDB.setMeta('active', name);
      this.toast('Now using ' + name, 6000);
    } catch (err) { console.error(err); this.toast('Could not load ' + name + ': ' + err.message, 10000); }
  }
  removeFont() {
    this.font = null; this._ik = ''; this.tracks.forEach(t => { if (t.engine === 'upload') t.engine = 'synth'; }); this.updateToolUI();
    FontDB.setMeta('active', null).catch(() => {});
    this.toast('Using the built-in synth. Your saved SoundFonts are still stored (File > SoundFonts).');
  }
  async fontsDlg() {
    const esc = x => String(x).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
    let list = [], err = '';
    try { list = (await FontDB.list()).sort((a, b) => a.name.localeCompare(b.name)); } catch (e) { err = e.message; }
    const active = this.font ? this.font.name : null; let pick = list.findIndex(r => r.name === active);
    const body = '<div style="min-width:min(420px,80vw)"><div class="tl" id="fl" style="width:100%;height:auto;min-height:70px;max-height:260px">' +
      (list.length ? list.map((r, i) => `<div class="ti" data-i="${i}" style="height:auto;padding:6px 8px 6px 26px">${esc(r.name)} <span style="opacity:.7">(${(r.size / 1048576).toFixed(1)} MB)</span>${r.name === active ? ' <b>- in use</b>' : ''}</div>`).join('')
        : `<div style="padding:12px;color:#555">${err ? 'Saving is not available here (' + esc(err) + '). SoundFonts will work for this visit only.' : 'No SoundFonts saved yet. Click Add SoundFont and pick a file (e.g. GeneralUser GS .sf2). It is kept on this device and loads automatically every time you open the editor.'}</div>`) +
      '</div><p style="font-size:11px;color:#444;margin:8px 0 0">Select a font and press Use selected. The font you used last loads automatically at startup.</p></div>';
    const d = this.dlg('SoundFonts', body, () => { if (pick >= 0 && list[pick].name !== active) this.useSaved(list[pick].name); },
      {okText: 'Use selected', extra: '<button id="fAdd">Add SoundFont...</button><button id="fDel">Delete</button><button id="fSyn">Built-in synth</button>'});
    const rows = d.querySelectorAll('.ti'), mark = () => rows.forEach((e, i) => e.classList.toggle('s', i === pick)); mark();
    rows.forEach((e, i) => e.onclick = () => { pick = i; mark(); });
    d.querySelector('#fAdd').onclick = () => { this.closeDlg(); document.getElementById('sfIn').click(); };
    d.querySelector('#fSyn').onclick = () => { this.removeFont(); this.closeDlg(); };
    d.querySelector('#fDel').onclick = async () => {
      if (pick < 0) return; const n = list[pick].name; if (!confirm('Delete "' + n + '" from this device?')) return;
      try { await FontDB.del(n); if (this.font && this.font.name === n) this.removeFont(); } catch (e) { this.toast('Delete failed: ' + e.message); }
      this.fontsDlg();
    };
  }

  /* ---------- import / export ---------- */
  project() {
    return {ppq: this.ppq, notes: this.notes, ccs: this.ccs, tempos: this.tempos.slice().sort((a, b) => a.t - b.t), markers: this.markers, tracks: this.tracks, ts: this.ts};
  }
  exportMidi() {
    if (!this.notes.length && !this.ccs.length) { this.toast('Nothing to export yet - draw or import some notes first.'); return; }
    let bytes;
    try { bytes = SMF.write(this.project()); }
    catch (err) { console.error(err); this.toast('Export failed: ' + err.message); return; }
    const base = (this.fileName || 'domino_export').replace(/\.(mid|midi|kar)$/i, '');
    const name = base + '.mid';
    const blob = new Blob([bytes], {type: 'audio/midi'});
    if (this.lastUrl) URL.revokeObjectURL(this.lastUrl);
    const url = URL.createObjectURL(blob); this.lastUrl = url;
    const a = document.createElement('a'); a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    const kb = (bytes.length / 1024).toFixed(1);
    this.toast(`Exported ${this.notes.length.toLocaleString()} notes (${kb} KB) as ${name}. If nothing downloaded, <a href="${url}" download="${name}" target="_blank">click here to save it</a>.`, 20000);
  }
  importFile(f) {
    this.toast('Loading ' + f.name + '...');
    const r = new FileReader();
    r.onload = () => setTimeout(() => {
      try {
        const m = SMF.parse(new Uint8Array(r.result));
        this.stop(); this.pushUndo();
        this.ppq = m.ppq; this.notes = m.notes; this.ccs = m.ccs; this.tempos = m.tempos; this.markers = m.markers; this.ts = m.ts;
        this.tracks.length = 0; this.ensureTracks(Math.max(16, Math.ceil(m.tracks.length / 16) * 16));
        m.tracks.forEach((t, i) => { const T = this.tracks[i]; if (t.name) T.name = t.name; T.program = t.program || 0; T.bank = t.bank || 0; });
        const used = new Set(m.notes.map(n => n.ch)); m.ccs.forEach(c => used.add(c.ch));
        this.visible = new Set(used.size ? [...used] : [0]);
        this.active = used.size ? Math.min(...used) : 0; this.visible.add(this.active);
        this.fileName = f.name; this.playTick = 0; this.scrollX = 0; this.gate = this.ppq; document.getElementById('iGate').value = this.gate;
        this.fillPPQ(); this.syncTimeSig(); this.fillTrackSelects(); this.touch(); this.ensureSorted();
        if (this.notes.length) { let lo = 127, hi = 0; for (const n of this.notes) { if (n.p < lo) lo = n.p; if (n.p > hi) hi = n.p; } const {h} = this.viewSize(); this.scrollY = Math.max(0, Math.min(128 * this.nh - h, (127 - (lo + hi) / 2) * this.nh - h / 2)); }
        this.updateToolUI();
        this.toast(`Imported ${m.notes.length.toLocaleString()} notes on ${used.size} track(s), ${m.ppq} PPQ.`);
      } catch (err) { console.error(err); this.toast('Import failed: ' + err.message); }
    }, 30);
    r.readAsArrayBuffer(f);
  }
}

window.addEventListener('load', () => { window.domino = new Domino(); window.domino.restoreFont(); });
</script>
