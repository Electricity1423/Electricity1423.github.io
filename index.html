<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Showcase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        
        .button-container {
            display: flex;
            gap: 15px; /* Spaces the buttons apart */
            margin-top: 20px;
        }

        /* Styles the links to look like solid buttons */
        .btn-link {
            display: inline-block;
            background-color: #007BFF; /* Primary blue color */
            color: white;
            padding: 12px 24px;
            text-decoration: none; /* Removes the underline */
            border-radius: 6px; /* Smooth rounded corners */
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        /* Darkens the button slightly when you hover your mouse over it */
        .btn-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>My Portfolio Projects</h1>
    <p>Click a button below to launch one of my applications:</p>
    
    <div class="button-container">
        <!-- Links to your specific files (Handles the space automatically) -->
        <a href="Sort Visualiser.html" class="btn-link">Launch Sort Visualiser</a>
        <a href="Fastest Route.html" class="btn-link">Launch Fastest Route</a>
    </div>

</body>
</html>
