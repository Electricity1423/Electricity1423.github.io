<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #121212; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-align: center;
        }

        p {
            color: #a0a0a0;
            font-size: 1rem;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .button-container {
            display: flex;
            gap: 15px; 
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-link {
            display: inline-block;
            background-color: #007AFF; 
            color: white;
            padding: 14px 28px;
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .btn-link:hover {
            background-color: #0063cc;
        }

        .btn-link:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>Project Showcase</h1>
    <p>Select a system application below:</p>
    
    <div class="button-container">
        <!-- These contain absolutely zero spaces, uppercase letters, or special characters -->
        <a href="sort-visualiser.html" class="btn-link">Sort Visualiser</a>
        <a href="fastest-route.html" class="btn-link">Fastest Route</a>
    </div>

</body>
</html>
