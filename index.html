<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #121212; 
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            color: #b3b3b3;
            font-size: 1.1rem;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .button-container {
            display: flex;
            gap: 20px; 
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-link {
            display: inline-block;
            background-color: #007AFF; 
            color: white;
            padding: 16px 32px;
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            transition: all 0.2s ease;
        }

        .btn-link:hover {
            background-color: #0063cc;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.5);
        }

        .btn-link:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <h1>Project Showcase</h1>
    <p>Tap a button below to launch one of my applications:</p>
    
    <div class="button-container">
        <!-- Clean, hyphenated, space-free links -->
        <a href="sort-visualiser.html" class="btn-link">Launch Sort Visualiser</a>
        <a href="fastest-route.html" class="btn-link">Launch Fastest Route</a>
    </div>

</body>
</html>
