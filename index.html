<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Sound Sorting Visualizer</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 10px; }
        .controls { background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: inline-flex; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center; max-width: 95vw; }
        .stats { background: #1e1e1e; padding: 8px 20px; border-radius: 8px; margin-bottom: 15px; display: inline-flex; gap: 25px; font-weight: bold; font-size: 15px; color: #00adb5; }
        .stat-val { color: #fff; }
        button, select { background: #00adb5; color: #fff; border: none; padding: 6px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:disabled, select:disabled { background: #444; color: #888; cursor: not-allowed; }
        input[type="range"] { accent-color: #00adb5; vertical-align: middle; }
        label { font-size: 13px; color: #ccc; }
        .val-display { display: inline-block; min-width: 35px; text-align: left; margin-left: 3px; color: #00adb5; font-weight: bold; }
        canvas { background: #1a1a1a; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <h1>Sound Sorting Visualizer</h1>
    <div class="controls">
        <button id="shf">Shuffle</button>
        <button id="srt">Sort</button>
        <button id="pse" disabled>Pause</button>
        <select id="alg">
            <option value="b">Bubble</option><option value="q">Quick</option><option value="i">Insertion</option>
            <option value="m">Merge</option><option value="h">Heap</option><option value="oe">Odd-Even</option>
            <option value="r">Radix</option><option value="g">Gravity (Bead)</option><option value="bg">Bogo</option>
            <option value="st">Stalin</option>
        </select>
        <select id="varSelect"></select>
        <select id="md">
            <option value="cc">Color Circle</option><option value="cl">Columns</option>
            <option value="dt">Dots</option><option value="dc">Disparity Circle</option>
        </select>
        <select id="clr"><option value="color">Color Mode</option><option value="white">No Color Mode (White)</option></select>
        <select id="snd">
            <option value="w0rthy">w0rthy Authentic</option><option value="sine">Pure Sine</option>
            <option value="square">Square Wave</option><option value="sawtooth">Sawtooth</option>
        </select>
        <label>Size: <input type="range" id="sz" min="6" max="1024" value="100"><span id="szv" class="val-display">100</span></label>
        <label>Array: <select id="arrType">
            <option value="random">Random</option>
            <option value="nearly">Nearly Sorted</option>
            <option value="sorted">Sorted</option>
            <option value="reversed">Reversed</option>
            <option value="few">Few Unique</option>
            <option value="organ">Organ Pipe</option>
            <option value="saw">Sawtooth</option>
        </select></label>
        <label>Delay: <input type="range" id="spd" min="0.1" max="100" step="0.1" value="10"><span id="spdv" class="val-display">10</span></label>
        <label id="rbl" class="hidden">Base: <input type="range" id="rb" min="2" max="10" value="4"><span id="rbv" class="val-display">4</span></label>
    </div>
    <div class="stats">
        <div>Comparisons: <span id="compCount" class="stat-val">0</span></div>
        <div>Swaps / Writes: <span id="swapCount" class="stat-val">0</span></div>
    </div>
    <div><canvas id="cv" width="600" height="480"></canvas></div>
    <script>
        const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), shf = document.getElementById('shf'), srt = document.getElementById('srt'), pse = document.getElementById('pse');
        const alg = document.getElementById('alg'), varSelect = document.getElementById('varSelect'), md = document.getElementById('md'), clr = document.getElementById('clr'), sz = document.getElementById('sz'), spd = document.getElementById('spd'), rb = document.getElementById('rb'), rbv = document.getElementById('rbv'), rbl = document.getElementById('rbl'), snd = document.getElementById('snd');
        const arrType = document.getElementById('arrType'), szv = document.getElementById('szv'), spdv = document.getElementById('spdv'), compCount = document.getElementById('compCount'), swapCount = document.getElementById('swapCount');
        let arr = [], active = [], isSrt = false, stopSrt = false, isPaused = false, audioCtx = null, totalComps = 0, totalSwaps = 0, statusMode = ""; let lastRenderTime = 0, verifiedIdx = -1, opsCount = 0;

        const variants = {
            b: [{v:"std",n:"Standard"}, {v:"cocktail",n:"Cocktail Shaker"}], q: [{v:"std",n:"Single-Pivot"}, {v:"dual",n:"Dual-Pivot"}],
            i: [{v:"std",n:"Standard"}, {v:"shell",n:"Shell Sort"}], m: [{v:"out",n:"Out of Place"}, {v:"iter",n:"Bottom-Up"}, {v:"inplace",n:"In-Place"}, {v:"weave",n:"Weave Merge"}],
            h: [{v:"max",n:"Max Heap Sort"}], oe: [{v:"std",n:"Odd-Even Brick"}], r: [{v:"lsd",n:"Radix LSD"}, {v:"msd",n:"Radix MSD"}],
            g: [{v:"std",n:"Standard Bead"}], bg: [{v:"std",n:"Standard"}, {v:"imp",n:"Improvised"}],
            st: [{v:"std",n:"Purge All (Strict)"}, {v:"selective",n:"Selective Purge (50%)"}, {v:"gulag",n:"Send to Back (Exile)"}]
        };

        function updateVariants() { 
            varSelect.innerHTML = ""; 
            variants[alg.value].forEach(x => { const o = document.createElement("option"); o.value = x.v; o.textContent = x.n; varSelect.appendChild(o); }); 
            rbl.className = alg.value === 'r' ? '' : 'hidden'; 
        }

        function makeArray(type, n) {
            let a = Array.from({length: n}, (_, i) => i);
            if (type === "random") {
                for (let i = n - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
            } else if (type === "nearly") {
                const swaps = Math.max(1, Math.floor(n * 0.05));
                for (let k = 0; k < swaps; k++) {
                    const i = Math.floor(Math.random() * n), j = Math.floor(Math.random() * n);
                    [a[i], a[j]] = [a[j], a[i]];
                }
            } else if (type === "sorted") {
                // Already sorted
            } else if (type === "reversed") {
                a.reverse();
            } else if (type === "few") {
                const levels = Math.max(3, Math.min(12, Math.floor(Math.sqrt(n))));
                for (let i = 0; i < n; i++) a[i] = Math.floor(i * levels / n) * Math.floor(n / levels);
                a = a.map(v => Math.min(n - 1, v));
            } else if (type === "organ") {
                for (let i = 0; i < n; i++) {
                    const half = Math.floor(n / 2);
                    a[i] = i <= half ? i : n - 1 - i;
                }
                const max = Math.max(...a, 1);
                a = a.map(v => Math.floor(v * (n - 1) / max));
            } else if (type === "saw") {
                const period = Math.max(3, Math.floor(n / 10));
                for (let i = 0; i < n; i++) a[i] = Math.floor((i % period) * n / period);
            }
            return a;
        }

        function init() {
            arr = makeArray(arrType.value, parseInt(sz.value));
            active = []; totalComps = totalSwaps = opsCount = 0; verifiedIdx = -1; statusMode = "";
            compCount.textContent = swapCount.textContent = 0; rndr();
        }

        const getDelay = () => parseFloat(spd.value), upStats = () => { compCount.textContent = totalComps; swapCount.textContent = totalSwaps; };
        const col = (v, i) => statusMode === "fw" ? '#fff' : (statusMode === "vf" ? (i === verifiedIdx ? '#00ff00' : '#fff') : (statusMode === "dn" ? (clr.value === 'white' ? '#fff' : `hsl(${(v/parseInt(sz.value))*360},100%,50%)`) : (active.includes(i) ? (statusMode === "sw" ? '#fff' : '#ffff00') : (clr.value === 'white' ? '#fff' : `hsl(${(v/parseInt(sz.value))*360},100%,50%)`))));

        shf.addEventListener('click', async () => {
            if (isSrt) { stopSrt = true; isPaused = false; pse.textContent = "Pause"; pse.disabled = true; return; }
            toggleUI(true); isSrt = true;
            totalSwaps = totalComps = 0; statusMode = "sw";
            const type = arrType.value, n = parseInt(sz.value);

            if (type === "random") {
                arr = Array.from({length: n}, (_, i) => i);
                for (let i = n - 1; i > 0; i--) {
                    if (stopSrt) break;
                    const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; active = [i, j]; totalSwaps++;
                    if (performance.now() - lastRenderTime > 16 || getDelay() >= 10) { rndr(); upStats(); lastRenderTime = performance.now(); }
                    if (arr[i] !== undefined) playTone(arr[i]); await zeroYield();
                }
            } else if (type === "nearly") {
                arr = Array.from({length: n}, (_, i) => i);
                const swaps = Math.max(1, Math.floor(n * 0.05));
                for (let k = 0; k < swaps; k++) {
                    if (stopSrt) break;
                    const i = Math.floor(Math.random() * n), j = Math.floor(Math.random() * n);
                    [arr[i], arr[j]] = [arr[j], arr[i]]; active = [i, j]; totalSwaps++;
                    if (performance.now() - lastRenderTime > 16 || getDelay() >= 10) { rndr(); upStats(); lastRenderTime = performance.now(); }
                    if (arr[i] !== undefined) playTone(arr[i]); await zeroYield();
                }
            } else if (type === "reversed") {
                arr = Array.from({length: n}, (_, i) => i);
                for (let i = 0; i < Math.floor(n / 2); i++) {
                    if (stopSrt) break;
                    const j = n - 1 - i;
                    [arr[i], arr[j]] = [arr[j], arr[i]]; active = [i, j]; totalSwaps++;
                    if (performance.now() - lastRenderTime > 16 || getDelay() >= 10) { rndr(); upStats(); lastRenderTime = performance.now(); }
                    if (arr[i] !== undefined) playTone(arr[i]); await zeroYield();
                }
            } else {
                const target = makeArray(type, n);
                arr = new Array(n);
                for (let i = 0; i < n; i++) {
                    if (stopSrt) break;
                    arr[i] = target[i]; active = [i]; totalSwaps++;
                    if (performance.now() - lastRenderTime > 16 || getDelay() >= 10) { rndr(); upStats(); lastRenderTime = performance.now(); }
                    if (arr[i] !== undefined) playTone(arr[i]); await zeroYield();
                }
            }
            isSrt = stopSrt = false; active = []; totalSwaps = totalComps = 0; upStats(); statusMode = ""; rndr(); toggleUI(false);
        });

        pse.addEventListener('click', () => {
            if (!isSrt) return;
            isPaused = !isPaused;
            pse.textContent = isPaused ? "Resume" : "Pause";
            alg.disabled = !isPaused;
            varSelect.disabled = !isPaused;
        });

        alg.addEventListener('change', () => {
            updateVariants();
            if (isSrt && isPaused) {
                stopSrt = true;
                isPaused = false;
                pse.textContent = "Pause";
                pse.disabled = true;
            }
        });

        varSelect.addEventListener('change', () => {
            if (isSrt && isPaused) {
                stopSrt = true;
                isPaused = false;
                pse.textContent = "Pause";
                pse.disabled = true;
            }
        });

        md.addEventListener('change', rndr); clr.addEventListener('change', rndr);
        arrType.addEventListener('change', () => { if (!isSrt) init(); });
        sz.addEventListener('input', (e) => { szv.textContent = e.target.value; init(); }); spd.addEventListener('input', (e) => spdv.textContent = e.target.value); rb.addEventListener('input', (e) => rbv.textContent = e.target.value);

        function playTone(v) {
            try {
                if (getDelay() <= 1 && Math.random() > 0.12) return; if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume();
                let o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.setValueAtTime(440 * Math.pow(2, ((24 + Math.round((v / parseInt(sz.value)) * 78)) - 69) / 12), audioCtx.currentTime);
                o.type = snd.value === 'w0rthy' ? 'triangle' : snd.value; g.gain.setValueAtTime(snd.value === 'square' || snd.value === 'sawtooth' ? 0.015 : 0.06, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.045); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.06);
            } catch(e) {}
        }
        function zeroYield() { return new Promise(r => { const c = new MessageChannel(); c.port1.onmessage = () => r(); c.port2.postMessage(null); }); }
        
        const sleep = async () => { 
            while (isPaused && !stopSrt) {
                await new Promise(r => setTimeout(r, 30));
            }
            if (stopSrt) return;
            opsCount++; 
            if (getDelay() <= 1) return opsCount % 12 === 0 ? zeroYield() : Promise.resolve(); 
            return new Promise(r => setTimeout(r, getDelay())); 
        };

        async function tC(i, j) { totalComps++; active = [i, j]; statusMode = "cp"; if (performance.now() - lastRenderTime > 16 || getDelay() > 1) { rndr(); upStats(); lastRenderTime = performance.now(); } if (arr[i] !== undefined) playTone(arr[i]); await sleep(); }
        async function tS(i, j) { totalSwaps++; active = [i, j]; statusMode = "sw"; if (performance.now() - lastRenderTime > 16 || getDelay() > 1) { rndr(); upStats(); lastRenderTime = performance.now(); } if (arr[i] !== undefined) playTone(arr[i]); await sleep(); }

        function rndr() {
            ctx.clearRect(0, 0, cv.width, cv.height); const m = md.value, len = arr.length, cX = cv.width/2, cY = cv.height/2, r = Math.min(cv.width, cv.height)/2 - 15;
            for (let i = 0; i < len; i++) {
                ctx.fillStyle = col(arr[i], i);
                if (m === 'cc') { ctx.beginPath(); ctx.moveTo(cX, cY); ctx.arc(cX, cY, r, i*(2*Math.PI)/len - Math.PI/2, (i+1)*(2*Math.PI)/len - Math.PI/2); ctx.fill(); }
                else if (m === 'cl') { const w = cv.width/len, h = ((arr[i]+1)/parseInt(sz.value))*(cv.height-20); ctx.fillRect(i*w, cv.height-h, Math.max(0.5, w), h); }
                else if (m === 'dt') { const s = cv.width/len, x = i*s + s/2, y = cv.height - (((arr[i]+1)/parseInt(sz.value))*(cv.height-40)) - 20; ctx.beginPath(); ctx.arc(x, y, Math.max(1, Math.min(6, 300/len)), 0, 2*Math.PI); ctx.fill(); }
                else if (m === 'dc') { const d = ((arr[i]+1)/parseInt(sz.value))*r, a = i*(2*Math.PI)/len - Math.PI/2; ctx.beginPath(); ctx.arc(cX + d*Math.cos(a), cY + d*Math.sin(a), Math.max(1, Math.min(5, 250/len)), 0, 2*Math.PI); ctx.fill(); }
            }
        }

        function toggleUI(d) { 
            srt.disabled = shf.disabled = sz.disabled = rb.disabled = arrType.disabled = d; 
            alg.disabled = varSelect.disabled = d && !isPaused;
            pse.disabled = !d;
        }

        srt.addEventListener('click', async () => {
            if (isSrt) return; isSrt = true; isPaused = false; pse.textContent = "Pause"; toggleUI(true); totalComps = totalSwaps = opsCount = 0; const a = alg.value, v = varSelect.value;
            if (a === 'b') { if (v === 'std') await bubble(); else await cocktail(); }
            else if (a === 'q') { if (v === 'std') await quick(); else await dualQuick(); }
            else if (a === 'i') { if (v === 'std') await insert(0, arr.length - 1); else await shell(); }
            else if (a === 'm') { if (v === 'out') await mergeOut(); else if (v === 'iter') await mergeIter(); else if (v === 'inplace') await mergeInP(); else await mergeWeave(); }
            else if (a === 'h') await heap(); else if (a === 'oe') await oddEven(); else if (a === 'r') { if (v === 'lsd') await radixLSD(); else await radixMSD(); } else if (a === 'g') await gravity(); else if (a === 'bg') { if (v === 'std') await bogo(); else await bogoImprovised(); }
            else if (a === 'st') { if (v === 'std') await stalin(); else if (v === 'selective') await stalinSelective(); else await stalinGulag(); }
            if (!stopSrt) { statusMode = "fw"; active = []; rndr(); upStats(); await new Promise(r => setTimeout(r, 200)); statusMode = "vf"; const sweep = Math.max(2, Math.min(30, 1200 / arr.length)); for (let i = 0; i < arr.length; i++) { if (stopSrt) break; verifiedIdx = i; active = [i]; if (performance.now() - lastRenderTime > 16 || sweep >= 10) rndr(); playTone(arr[i]); await new Promise(r => setTimeout(r, sweep)); } statusMode = "done"; }
            isSrt = stopSrt = isPaused = false; pse.textContent = "Pause"; active = []; verifiedIdx = -1; rndr(); upStats(); toggleUI(false);
        });

        async function bubble() { for (let i = 0; i < arr.length-1; i++) { for (let j = 0; j < arr.length-i-1; j++) { if (stopSrt) return; await tC(j, j+1); if (arr[j] > arr[j+1]) { [arr[j], arr[j+1]] = [arr[j+1], arr[j]]; await tS(j, j+1); } } } }
        async function cocktail() { let s = 0, e = arr.length - 1, sw = true; while (sw) { sw = false; for (let i = s; i < e; i++) { if (stopSrt) return; await tC(i, i+1); if (arr[i] > arr[i+1]) { [arr[i], arr[i+1]] = [arr[i+1], arr[i]]; await tS(i, i+1); sw = true; } } if (!sw) break; e--; for (let i = e - 1; i >= s; i--) { if (stopSrt) return; await tC(i, i+1); if (arr[i] > arr[i+1]) { [arr[i], arr[i+1]] = [arr[i+1], arr[i]]; await tS(i, i+1); sw = true; } } s++; } }
        async function insert(l, h) { for (let i = l + 1; i <= h; i++) { let k = arr[i], j = i - 1; while (j >= l) { if (stopSrt) return; await tC(j, j+1); if (arr[j] > k) { arr[j+1] = arr[j]; await tS(j, j+1); j--; } else break; } arr[j+1] = k; } }
        async function shell() { for (let g = Math.floor(arr.length/2); g > 0; g = Math.floor(g/2)) { for (let i = g; i < arr.length; i++) { let t = arr[i], j = i; while (j >= g) { if (stopSrt) return; await tC(j - g, j); if (arr[j - g] > t) { arr[j] = arr[j - g]; await tS(j - g, j); j -= g; } else break; } arr[j] = t; } } }
        
        async function quick() {
            let stack = [0, arr.length - 1];
            while (stack.length > 0) {
                let h = stack.pop(), l = stack.pop(); if (l >= h || stopSrt) continue;
                let p = arr[h], i = l - 1;
                for (let j = l; j < h; j++) { if (stopSrt) return; await tC(j, h); if (arr[j] < p) { i++; [arr[i], arr[j]] = [arr[j], arr[i]]; await tS(i, j); } }
                [arr[i+1], arr[h]] = [arr[h], arr[i+1]]; await tS(i+1, h); let idx = i + 1;
                stack.push(l, idx - 1); stack.push(idx + 1, h);
            }
        }

        async function dualQuick() {
            let stack = [0, arr.length - 1];
            while (stack.length > 0) {
                let h = stack.pop(), l = stack.pop(); if (l >= h || stopSrt) continue;
                await tC(l, h); if (arr[l] > arr[h]) { [arr[l], arr[h]] = [arr[h], arr[l]]; await tS(l, h); }
                let p1 = arr[l], p2 = arr[h], lt = l + 1, gt = h - 1, k = l + 1;
                while (k <= gt) { if (stopSrt) return; await tC(k, l); if (arr[k] < p1) { [arr[k], arr[lt]] = [arr[lt], arr[k]]; await tS(k, lt); lt++; } else { await tC(k, h); if (arr[k] >= p2) { while (arr[gt] > p2 && k < gt) { if (stopSrt) return; totalComps++; gt--; } [arr[k], arr[gt]] = [arr[gt], arr[k]]; await tS(k, gt); gt--; await tC(k, l); if (arr[k] < p1) { [arr[k], arr[lt]] = [arr[lt], arr[k]]; await tS(k, lt); lt++; } } } k++; }
                lt--; gt++; [arr[l], arr[lt]] = [arr[lt], arr[l]]; await tS(l, lt); [arr[h], arr[gt]] = [arr[gt], arr[h]]; await tS(h, gt);
                stack.push(l, lt - 1); if (p1 < p2) stack.push(lt + 1, gt - 1); stack.push(gt + 1, h);
            }
        }

        async function mergeOut() {
            let n = arr.length;
            for (let curr_size = 1; curr_size <= n - 1; curr_size = 2 * curr_size) {
                for (let left_start = 0; left_start < n - 1; left_start += 2 * curr_size) {
                    let mid = Math.min(left_start + curr_size - 1, n - 1), right_end = Math.min(left_start + 2 * curr_size - 1, n - 1);
                    let temp = [], i = left_start, j = mid + 1;
                    while (i <= mid && j <= right_end) { if (stopSrt) return; await tC(i, j); if (arr[i] <= arr[j]) temp.push(arr[i++]); else temp.push(arr[j++]); }
                    while (i <= mid) temp.push(arr[i++]); while (j <= right_end) temp.push(arr[j++]);
                    for (let k = 0; k < temp.length; k++) { if (stopSrt) return; arr[left_start + k] = temp[k]; await tS(left_start + k, left_start + k); }
                }
            }
        }

        async function mergeIter() { let n = arr.length; for (let s = 1; s < n; s *= 2) { for (let l = 0; l < n - 1; l += 2 * s) { let m = Math.min(l + s - 1, n - 1), r = Math.min(l + 2 * s - 1, n - 1), left = arr.slice(l, m + 1), right = arr.slice(m + 1, r + 1), i = 0, j = 0, k = l; while (i < left.length && j < right.length) { if (stopSrt) return; totalComps++; active = [k]; statusMode = "cp"; arr[k] = left[i] <= right[j] ? left[i++] : right[j++]; await tS(k, k); k++; } while (i < left.length) { if (stopSrt) return; arr[k] = left[i++]; await tS(k, k); k++; } while (j < right.length) { if (stopSrt) return; arr[k] = right[j++]; await tS(k, k); k++; } } } }
        
        async function mergeInP() {
            let n = arr.length;
            for (let curr_size = 1; curr_size <= n - 1; curr_size = 2 * curr_size) {
                for (let left_start = 0; left_start < n - 1; left_start += 2 * curr_size) {
                    let l = left_start, m = Math.min(left_start + curr_size - 1, n - 1), r = Math.min(left_start + 2 * curr_size - 1, n - 1);
                    let s2 = m + 1;
                    while (l <= m && s2 <= r) {
                        if (stopSrt) return; await tC(l, s2);
                        if (arr[l] <= arr[s2]) l++; 
                        else {
                            let v = arr[s2], idx = s2;
                            while (idx !== l) { if (stopSrt) return; arr[idx] = arr[idx - 1]; await tS(idx, idx); idx--; }
                            arr[l] = v; await tS(l, l); l++; m++; s2++;
                        }
                    }
                }
            }
        }

        async function mergeWeave() {
            let n = arr.length;
            for (let curr_size = 1; curr_size <= n - 1; curr_size = 2 * curr_size) {
                for (let left_start = 0; left_start < n - 1; left_start += 2 * curr_size) {
                    let l = left_start, m = Math.min(left_start + curr_size - 1, n - 1), r = Math.min(left_start + 2 * curr_size - 1, n - 1);
                    let i = l, j = m + 1;
                    while (i <= m && j <= r) {
                        if (stopSrt) return; await tC(i, j);
                        if (arr[i] > arr[j]) {
                            let v = arr[j]; for (let k = j; k > i; k--) { if (stopSrt) return; arr[k] = arr[k - 1]; await tS(k, k); }
                            arr[i] = v; await tS(i, i); m++; j++;
                        }
                        i += 2;
                    }
                    await insert(l, r);
                }
            }
        }

        async function heap() {
            const n = arr.length;

            async function siftDown(start, heapSize) {
                let root = start;

                while (root * 2 + 1 < heapSize) {
                    if (stopSrt) return;

                    let child = root * 2 + 1;
                    let max = root;

                    await tC(child, max);
                    if (arr[child] > arr[max]) max = child;

                    if (child + 1 < heapSize) {
                        await tC(child + 1, max);
                        if (arr[child + 1] > arr[max]) max = child + 1;
                    }

                    if (max === root) break;

                    [arr[root], arr[max]] = [arr[max], arr[root]];
                    await tS(root, max);
                    root = max;
                }
            }

            for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
                if (stopSrt) return;
                await siftDown(i, n);
            }

            for (let end = n - 1; end > 0; end--) {
                if (stopSrt) return;

                [arr[0], arr[end]] = [arr[end], arr[0]];
                await tS(0, end);

                await siftDown(0, end);
            }
        }

        async function oddEven() { let sorted = false; while (!sorted) { sorted = true; for (let i = 1; i < arr.length - 1; i += 2) { if (stopSrt) return; await tC(i, i+1); if (arr[i] > arr[i+1]) { [arr[i], arr[i+1]] = [arr[i+1], arr[i]]; await tS(i, i+1); sorted = false; } } for (let i = 0; i < arr.length - 1; i += 2) { if (stopSrt) return; await tC(i, i+1); if (arr[i] > arr[i+1]) { [arr[i], arr[i+1]] = [arr[i+1], arr[i]]; await tS(i, i+1); sorted = false; } } } }
        async function radixLSD() { let base = parseInt(rb.value), max = arr.length - 1, exp = 1; while (Math.floor(max / exp) > 0) { let bkts = Array.from({length: base}, () => []); for (let i = 0; i < arr.length; i++) { if (stopSrt) return; totalComps++; active = [i]; statusMode = "cp"; bkts[Math.floor(arr[i] / exp) % base].push(arr[i]); if (performance.now() - lastRenderTime > 16 || getDelay() > 1) { rndr(); upStats(); lastRenderTime = performance.now(); } await sleep(); } let idx = 0; for (let b = 0; b < base; b++) { for (let v of bkts[b]) { if (stopSrt) return; arr[idx] = v; await tS(idx, idx); idx++; } } exp *= base; } }
        
        async function radixMSD() {
            let base = parseInt(rb.value), max = arr.length - 1, mExp = 1; while (Math.floor(max / mExp) >= base) mExp *= base;
            let runStack = [{l: 0, r: arr.length - 1, exp: mExp}];
            while (runStack.length > 0) {
                let task = runStack.pop(), l = task.l, r = task.r, exp = task.exp; if (l >= r || exp <= 0 || stopSrt) continue;
                let bkts = Array.from({length: base}, () => []);
                for (let i = l; i <= r; i++) {
                    if (stopSrt) return; totalComps++; active = [i]; statusMode = "cp"; bkts[Math.floor(arr[i]/exp)%base].push(arr[i]);
                    if (performance.now() - lastRenderTime > 16 || getDelay() > 1) { rndr(); upStats(); lastRenderTime = performance.now(); } await sleep();
                }
                let idx = l, cts = [l];
                for (let b = 0; b < base; b++) { for (let v of bkts[b]) { if (stopSrt) return; arr[idx] = v; await tS(idx, idx); idx++; } cts.push(idx); }
                for (let b = base - 1; b >= 0; b--) { runStack.push({l: cts[b], r: cts[b+1] - 1, exp: Math.floor(exp / base)}); }
            }
        }

        async function gravity() {
            const n = arr.length;
            let maxVal = 0;
            for (let i = 0; i < n; i++) if (arr[i] > maxVal) maxVal = arr[i];
            if (maxVal === 0) return;

            let beads = Array.from({length: n}, () => new Uint8Array(maxVal + 1));
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < arr[i]; j++) {
                    beads[i][j] = 1;
                }
            }

            for (let j = 0; j < maxVal; j++) {
                let sum = 0;
                for (let i = 0; i < n; i++) {
                    if (stopSrt) return;
                    totalComps++;
                    sum += beads[i][j];
                    beads[i][j] = 0;
                }
                for (let i = n - 1; i >= n - sum; i--) {
                    beads[i][j] = 1;
                }

                for (let i = 0; i < n; i++) {
                    let count = 0;
                    for (let k = 0; k <= maxVal; k++) {
                        if (beads[i][k]) count++;
                    }
                    if (arr[i] !== count) {
                        arr[i] = count;
                        await tS(i, i);
                    }
                }
            }
        }

        async function bogo() { while (true) { let s = true; for(let i=0; i<arr.length-1; i++) { totalComps++; active = [i, i+1]; statusMode = "cp"; if(arr[i]>arr[i+1]) { s = false; break; } } if (s || stopSrt) return; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; totalSwaps++; active = [i, j]; statusMode = "sw"; } if (performance.now() - lastRenderTime > 16 || getDelay() > 1) { rndr(); upStats(); lastRenderTime = performance.now(); } await sleep(); } }
        
        async function bogoImprovised() {
            let i = 0;
            while (i < arr.length - 1) {
                if (stopSrt) return;
                await tC(i, i + 1);
                if (arr[i] <= arr[i + 1]) {
                    i++;
                } else {
                    for (let k = arr.length - 1; k > i; k--) {
                        if (stopSrt) return;
                        const j = i + Math.floor(Math.random() * (k - i + 1));
                        [arr[k], arr[j]] = [arr[j], arr[k]];
                        totalSwaps++; active = [k, j]; statusMode = "sw";
                        if (performance.now() - lastRenderTime > 16 || getDelay() > 1) { rndr(); upStats(); lastRenderTime = performance.now(); }
                        if (arr[k] !== undefined) playTone(arr[k]);
                        await sleep();
                    }
                    i = 0;
                }
            }
        }

        async function stalin() {
            if (arr.length <= 1) return;
            let maxSeen = arr[0];
            let i = 1;
            while (i < arr.length) {
                if (stopSrt) return;
                await tC(i - 1, i);
                if (arr[i] < maxSeen) {
                    totalSwaps++;
                    arr.splice(i, 1);
                    active = [i];
                    statusMode = "sw";
                    if (performance.now() - lastRenderTime > 16 || getDelay() > 1) {
                        rndr(); upStats(); lastRenderTime = performance.now();
                    }
                    await sleep();
                } else {
                    maxSeen = arr[i];
                    i++;
                }
            }
        }

        async function stalinSelective() {
            if (arr.length <= 1) return;
            let maxSeen = arr[0];
            let i = 1;
            while (i < arr.length) {
                if (stopSrt) return;
                await tC(i - 1, i);
                if (arr[i] < maxSeen) {
                    if (Math.random() < 0.5) {
                        totalSwaps++;
                        arr.splice(i, 1);
                        active = [i];
                        statusMode = "sw";
                        if (performance.now() - lastRenderTime > 16 || getDelay() > 1) {
                            rndr(); upStats(); lastRenderTime = performance.now();
                        }
                        await sleep();
                    } else {
                        i++;
                    }
                } else {
                    maxSeen = arr[i];
                    i++;
                }
            }
        }

        async function stalinGulag() {
            if (arr.length <= 1) return;
            let maxSeen = arr[0];
            let i = 1;
            let endBound = arr.length;
            while (i < endBound) {
                if (stopSrt) return;
                await tC(i - 1, i);
                if (arr[i] < maxSeen) {
                    totalSwaps++;
                    let exiled = arr.splice(i, 1)[0];
                    arr.push(exiled);
                    endBound--;
                    active = [i, arr.length - 1];
                    statusMode = "sw";
                    if (performance.now() - lastRenderTime > 16 || getDelay() > 1) {
                        rndr(); upStats(); lastRenderTime = performance.now();
                    }
                    await sleep();
                } else {
                    maxSeen = arr[i];
                    i++;
                }
            }
        }

        updateVariants(); init();
    </script>
